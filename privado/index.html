<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Área do organizador | Azul Marinho</title>
<meta name="theme-color" content="#0F1F47">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Ubuntu:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">

<style>
.cabecalho{
    background:linear-gradient(135deg, var(--marinho-escuro), var(--marinho) 60%, var(--marinho-medio));
    color:#DCE6F7; padding:50px 0 60px;
}
.cabecalho h1{ color:var(--branco); font-size:clamp(28px, 4vw, 40px); margin:8px 0 10px; }
.cadeado{ display:inline-flex; gap:8px; align-items:center; background:rgba(0,173,239,.15); color:var(--ciano);
    border:1px solid rgba(0,173,239,.4); border-radius:999px; padding:5px 14px; font-size:14px; }
.lista-eventos{ display:grid; gap:18px; }
.ev{ background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio); overflow:hidden; }
.ev summary{
    list-style:none; cursor:pointer; padding:20px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px;
}
.ev summary::-webkit-details-marker{ display:none; }
.ev summary h2{ font-size:19px; }
.ev summary small{ color:var(--texto-claro); display:block; margin-top:4px; }
.ev .qtd{ background:var(--ciano-claro); color:var(--ciano-escuro); font-weight:700; border-radius:999px; padding:6px 14px; white-space:nowrap; }
.ev[open] summary{ border-bottom:1px solid var(--borda); }
.nomes{ list-style:none; padding:18px 24px 24px; columns:2 340px; column-gap:32px; }
.nomes li{ padding:8px 0; break-inside:avoid; border-bottom:1px dashed var(--borda); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.nomes li .nome{ flex:1; min-width:140px; }
.convite{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-size:13px; font-weight:500;
    color:var(--branco); background:var(--ciano); border-radius:999px; padding:5px 12px;
}
.convite svg{ width:15px; height:15px; }
.convite.enviado{ background:var(--fundo-suave); color:var(--texto-claro); }
.sem-whats{ font-size:13px; color:var(--texto-claro); }
.nomes li span{ color:var(--texto-claro); margin-right:8px; font-size:14px; }
.acoes{ padding:0 24px 22px; display:flex; gap:10px; flex-wrap:wrap; }
.acoes button, .acoes a{
    border:1.5px solid var(--ciano); color:var(--ciano-escuro); background:none; border-radius:999px; padding:7px 14px;
    font:inherit; font-size:14px; cursor:pointer; text-decoration:none;
}
.acoes button:hover, .acoes a:hover{ background:var(--ciano); color:var(--branco); }
.vazio{ padding:18px 24px 24px; color:var(--texto-claro); }
</style>
</head>

<body data-pagina="eventos" data-sem-whats>

<div id="topo"></div>

<header class="cabecalho">
    <div class="wrap">
        <span class="cadeado">🔒 Área privada</span>
        <h1>Listas de convidados</h1>
        <p>Só o organizador tem acesso a esta página. Clique em "Enviar convite" para abrir o WhatsApp do convidado com o convite pronto; é só apertar enviar.</p>
    </div>
</header>

<section class="secao" style="padding-top:50px">
    <div class="wrap lista-eventos" id="lista"></div>
</section>

<div id="rodape"></div>

<script src="/assets/js/site.js"></script>
<script src="/assets/js/eventos-comum.js"></script>
<script src="/eventos/eventos.js"></script>
<script src="/privado/convidados.js"></script>
<script>
(function () {
    var esc = EV.esc, C = window.CONVIDADOS || {}, I = window.ICONES;
    var g = EV.separar();
    var todos = g.proximos.concat(g.passados);
    var aberto = decodeURIComponent(location.hash.slice(1));

    /* Aceita "Nome" ou { nome: "Nome", whats: "31999998888" } */
    function pessoa(c) { return typeof c === "string" ? { nome: c, whats: "" } : { nome: c.nome || "", whats: String(c.whats || "") }; }
    function numero(w) {
        var d = w.replace(/\D/g, "");
        if (!d) return "";
        return d.length <= 11 ? "55" + d : d;
    }
    function convite(ev, nome) {
        var link = window.AZUL.site + "/eventos/evento.html?id=" + encodeURIComponent(ev.id);
        return "Olá, " + nome.split(" ")[0] + "! 🎉\n" +
            "Você está convidado(a) para *" + ev.titulo + "*.\n\n" +
            "📅 " + EV.dataLonga(ev) + (ev.hora ? ", às " + ev.hora : "") + "\n" +
            (ev.local ? "📍 " + ev.local + (ev.endereco ? " (" + ev.endereco + ")" : "") + "\n" : "") +
            "\nTodos os detalhes, mapa, previsão do tempo e playlist:\n" + link + "\n\nConto com você!";
    }

    /* Marca de "já enviado" fica só neste aparelho */
    function chave(id, i) { return "convite:" + id + ":" + i; }
    function foiEnviado(id, i) { try { return localStorage.getItem(chave(id, i)) === "1"; } catch (e) { return false; } }
    function marcar(id, i) { try { localStorage.setItem(chave(id, i), "1"); } catch (e) {} }

    document.getElementById("lista").innerHTML = todos.map(function (ev) {
        var lista = (C[ev.id] || []).map(pessoa);
        var comWhats = lista.filter(function (p) { return numero(p.whats); }).length;
        return '<details class="ev" id="' + esc(ev.id) + '"' + (ev.id === aberto ? " open" : "") + '>' +
            '<summary><div><h2>' + esc(ev.titulo) + '</h2><small>' + EV.dataCurta(ev) + (ev.local ? " • " + esc(ev.local) : "") +
                (comWhats ? " • " + comWhats + " com WhatsApp" : "") + '</small></div>' +
            '<span class="qtd">' + lista.length + (lista.length === 1 ? " convidado" : " convidados") + '</span></summary>' +
            (lista.length
                ? '<ol class="nomes">' + lista.map(function (p, i) {
                    var n = numero(p.whats);
                    var botao = n
                        ? '<a class="convite' + (foiEnviado(ev.id, i) ? " enviado" : "") + '" data-ev="' + esc(ev.id) + '" data-i="' + i + '" href="https://wa.me/' + n + '?text=' + encodeURIComponent(convite(ev, p.nome)) + '" target="_blank" rel="noopener">' +
                            I.whats + (foiEnviado(ev.id, i) ? "Enviado ✓" : "Enviar convite") + '</a>'
                        : '<span class="sem-whats">sem WhatsApp</span>';
                    return '<li><span>' + (i + 1) + '.</span><span class="nome">' + esc(p.nome) + '</span>' + botao + '</li>';
                  }).join("") + '</ol>' +
                  '<div class="acoes"><button data-copiar="' + esc(ev.id) + '">Copiar lista</button>' +
                  '<a href="/eventos/evento.html?id=' + encodeURIComponent(ev.id) + '">Ver página do evento</a></div>'
                : '<p class="vazio">Nenhum convidado cadastrado para este evento.</p>') +
            '</details>';
    }).join("");

    document.addEventListener("click", function (e) {
        var c = e.target.closest(".convite");
        if (c) {
            marcar(c.getAttribute("data-ev"), c.getAttribute("data-i"));
            c.classList.add("enviado");
            c.innerHTML = I.whats + "Enviado ✓";
            return;
        }
        var b = e.target.closest("[data-copiar]");
        if (!b) return;
        var ev = EV.buscar(b.getAttribute("data-copiar"));
        var nomes = (C[ev.id] || []).map(pessoa);
        var texto = ev.titulo + " (" + EV.dataCurta(ev) + ")\n" + nomes.map(function (p, i) { return (i + 1) + ". " + p.nome; }).join("\n");
        navigator.clipboard.writeText(texto).then(function () {
            b.textContent = "Copiado!";
            setTimeout(function () { b.textContent = "Copiar lista"; }, 1800);
        });
    });

    if (aberto && document.getElementById(aberto)) document.getElementById(aberto).scrollIntoView();
})();
</script>

</body>
</html>
