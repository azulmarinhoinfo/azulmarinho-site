<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel do organizador | Azul Marinho</title>
<meta name="theme-color" content="#0F1F47">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Azul Marinho">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Ubuntu:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">

<style>
body{ background:var(--fundo-suave); }
.cabecalho{
    background:linear-gradient(135deg, var(--marinho-escuro), var(--marinho) 60%, var(--marinho-medio));
    color:#DCE6F7; padding:34px 0 38px;
}
.cabecalho .wrap{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.cabecalho h1{ color:var(--branco); font-size:clamp(24px, 3.4vw, 34px); margin:6px 0 0; }
.cadeado{ display:inline-flex; gap:8px; align-items:center; background:rgba(0,173,239,.15); color:var(--ciano);
    border:1px solid rgba(0,173,239,.4); border-radius:999px; padding:4px 13px; font-size:13px; }
.quem{ font-size:14px; text-align:right; }
.quem a{ color:var(--ciano); }

.painel{ display:grid; grid-template-columns:300px 1fr; gap:24px; padding:28px 0 120px; align-items:start; }
.painel.so-lista{ grid-template-columns:1fr; max-width:640px; gap:14px; }
.painel.so-lista .lateral{ position:static; max-height:none; }
.painel.so-lista .lateral .itens{ max-height:none; }
.painel.com-evento{ grid-template-columns:1fr; gap:12px; }
.titulo-lista{ font-family:"Montserrat",sans-serif; font-size:24px; margin:0; color:var(--marinho, #0F1F47); }
.nota-lista{ margin:0; font-size:14px; color:var(--texto-claro); }
.voltar-lista{ display:flex; }
.caixa{ background:var(--branco); border:1px solid var(--borda); border-radius:var(--raio); min-width:0; }

/* Lista de eventos */
.lateral{ position:sticky; top:84px; max-height:calc(100vh - 110px); display:flex; flex-direction:column; overflow:hidden; }
.lateral .topo-lista{ padding:16px; border-bottom:1px solid var(--borda); }
.lateral .itens{ overflow:auto; padding:6px 0 10px; }
.grupo{ font-family:"Montserrat",sans-serif; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
    color:var(--texto-claro); padding:14px 16px 6px; }
.item{ display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:0; background:none; cursor:pointer;
    padding:10px 16px; font:inherit; color:var(--texto); border-left:3px solid transparent; }
.item:hover{ background:var(--fundo-suave); }
.item.ativo{ background:var(--ciano-claro); border-left-color:var(--ciano); }
.item .emo{ font-size:24px; width:32px; text-align:center; flex-shrink:0; }
.item b{ display:block; font-size:15px; font-weight:500; color:var(--marinho); line-height:1.25; }
.item small{ color:var(--texto-claro); font-size:13px; }
.selo{ display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:1px 8px; margin-left:4px;
    background:#FEF3C7; color:#92400E; vertical-align:middle; }

/* Botões do painel */
.b{ display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:999px; padding:9px 18px; cursor:pointer;
    font:500 15px "Ubuntu",sans-serif; border:1.5px solid var(--ciano); color:var(--ciano-escuro); background:var(--branco);
    text-decoration:none; transition:background .15s, color .15s; }
.b:hover{ background:var(--ciano); color:var(--branco); }
.b.cheio{ background:var(--ciano); color:var(--branco); }
.b.cheio:hover{ background:var(--ciano-escuro); }
.b.perigo{ border-color:#E11D48; color:#BE123C; }
.b.perigo:hover{ background:#E11D48; color:#fff; }
.b.pequeno{ padding:5px 12px; font-size:13px; }

/* Nome sugerido do álbum (iCloud / Google Fotos) */
.aviso-conferir{ margin:0 0 14px; padding:10px 14px; border:1.5px solid #F59E0B; background:#FFFBEB; color:#78350F; border-radius:12px; font-size:14px; }
.aviso-conferir ul{ margin:6px 0 0; padding-left:20px; }
.aviso-conferir[hidden]{ display:none; }
.nome-album-sug{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px;
    background:#EEF8FD; border:1px solid #BEE6F7; border-radius:12px; padding:10px 14px; margin:6px 0 14px; font-size:14px; }

/* Prévia do evento (por cima do painel) */
#previa{ position:fixed; inset:0; z-index:1000; background:#0F1F47; display:none; flex-direction:column; }
#previa.aberta{ display:flex; }
#previa .previa-barra{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px;
    background:#FACC15; color:#1F2937; font-size:14px; line-height:1.35; }
#previa .previa-barra .b{ background:#fff; flex-shrink:0; }
#previa iframe{ flex:1; width:100%; border:0; background:#fff; }
.b svg{ width:16px; height:16px; }
.b[disabled]{ opacity:.5; cursor:default; }
.largo{ width:100%; }

/* Editor */
.editor-topo{ padding:22px 26px 0; display:flex; gap:18px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; }
.editor-topo h2{ font-size:24px; }
.editor-topo .acoes{ display:flex; gap:8px; flex-wrap:wrap; }
.abas{ display:flex; gap:4px; padding:16px 26px 0; border-bottom:1px solid var(--borda); }
.abas button{ border:0; background:none; font:600 15px "Montserrat",sans-serif; color:var(--texto-claro); padding:10px 16px;
    border-bottom:3px solid transparent; cursor:pointer; margin-bottom:-1px; }
.abas button.ativa{ color:var(--marinho); border-bottom-color:var(--ciano); }
.conteudo-aba{ padding:24px 26px 30px; }

.campos{ display:grid; grid-template-columns:repeat(6, 1fr); gap:16px 18px; }
.campo{ display:flex; flex-direction:column; gap:6px; grid-column:span 6; }
.campo.m3{ grid-column:span 3; } .campo.m2{ grid-column:span 2; }
.campo label, .rotulo{ font-family:"Montserrat",sans-serif; font-weight:600; font-size:14px; color:var(--marinho); }
.campo .dica{ font-size:13px; color:var(--texto-claro); }
.campo input, .campo select, .campo textarea, .linha-conv input, .add-conv input, textarea.varios{
    font:inherit; font-size:16px; color:var(--texto); border:1.5px solid var(--borda); border-radius:10px; padding:10px 12px;
    background:var(--branco); width:100%;
}
.campo input:focus, .campo select:focus, .campo textarea:focus, .linha-conv input:focus, .add-conv input:focus, textarea.varios:focus{
    outline:none; border-color:var(--ciano); box-shadow:0 0 0 3px rgba(0,173,239,.18);
}
.campo textarea{ min-height:150px; resize:vertical; }
.campo input.erro{ border-color:#E11D48; }
.secao-form{ grid-column:span 6; font-family:"Montserrat",sans-serif; font-weight:700; font-size:13px; letter-spacing:1px;
    text-transform:uppercase; color:var(--ciano-escuro); padding-top:10px; border-top:1px solid var(--borda); margin-top:6px; }
.secao-form:first-child{ border-top:0; padding-top:0; margin-top:0; }
.check{ display:flex; gap:10px; align-items:center; font-size:15px; cursor:pointer; }
.check input{ width:18px; height:18px; accent-color:var(--ciano); }
.cores{ display:flex; gap:14px; flex-wrap:wrap; }
.cores label{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; color:var(--texto-claro); }
.cores input[type=color]{ width:52px; height:38px; border:1px solid var(--borda); border-radius:8px; padding:2px; background:#fff; }

.amostra{ grid-column:span 6; border-radius:14px; padding:22px 24px; display:flex; gap:16px; align-items:center; }
.amostra .e{ font-size:46px; }
.ideias-tema{ background:rgba(0,173,239,.08); border:1px solid rgba(0,173,239,.3); border-radius:12px; padding:12px 16px; margin:10px 0; font-size:14px; }
.ideias-tema ul{ margin:6px 0 0; padding-left:20px; }
.ideias-tema li{ margin:2px 0; }
.foto-grupo-capa{ display:flex; align-items:center; gap:12px; margin-top:10px; font-size:14px; }
.foto-grupo-capa img{ width:72px; height:72px; object-fit:cover; border-radius:50%; flex:none; border:2px solid var(--borda); }
.amostra b{ font-family:"Montserrat",sans-serif; font-size:20px; display:block; }
.amostra span.btn-a{ display:inline-block; margin-top:8px; border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700; }

/* Convidados */
.add-conv{ display:grid; grid-template-columns:1.4fr 1fr auto; gap:10px; }
.linhas{ list-style:none; margin-top:18px; border-top:1px solid var(--borda); }
.linha-conv{ display:grid; grid-template-columns:28px 1.4fr 1fr auto auto; gap:10px; align-items:center; padding:9px 0; border-bottom:1px dashed var(--borda); }
.linha-conv .n{ color:var(--texto-claro); font-size:14px; text-align:right; }
.linha-conv input{ padding:7px 10px; font-size:15px; }
.convite{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-size:13px; font-weight:500; white-space:nowrap;
    color:var(--branco); background:#25D366; border-radius:999px; padding:6px 12px;
}
.convite svg{ width:15px; height:15px; }
.convite.enviado{ background:var(--fundo-suave); color:var(--texto-claro); box-shadow:inset 0 0 0 1px var(--borda); font-weight:400; }
.convite.inativo{ background:var(--fundo-suave); color:var(--texto-claro); pointer-events:none; }
.marcas{ grid-column:2 / -1; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin-top:-2px; }
.marca{ display:inline-flex; align-items:center; gap:5px; font-size:13px; color:var(--texto-claro); cursor:pointer;
    border:1.5px solid var(--borda); border-radius:999px; padding:4px 10px; background:var(--branco); user-select:none; white-space:nowrap; }
.marca input{ width:15px; height:15px; margin:0; accent-color:var(--ciano); }
.marca:has(input:checked){ border-color:var(--ciano); background:var(--ciano-claro); color:var(--marinho); font-weight:500; }
.marca.conf:has(input:checked){ border-color:#16A34A; background:#DCFCE7; color:#14532D; }
.marca.grp.oculto{ display:none; }
.marca.grp:has(input:checked){ border-color:#25D366; background:#E7FBEF; color:#075E54; }
.marca.nao:has(input:checked){ border-color:#E11D48; background:#FFE4E6; color:#881337; }
.pelo-link{ font-size:12px; color:var(--texto-claro); white-space:nowrap; }
.opcoes{ display:inline-flex; border:1.5px solid var(--borda); border-radius:999px; overflow:hidden; background:var(--branco); }
.opcoes button{ border:0; background:none; font:inherit; font-size:13px; color:var(--texto-claro); padding:5px 11px; cursor:pointer; white-space:nowrap; }
.opcoes button + button{ border-left:1.5px solid var(--borda); }
.opcoes button:hover{ background:var(--fundo-suave); }
.opcoes button.ativa{ background:var(--marinho); color:var(--branco); font-weight:500; }
.idade{ display:none; align-items:center; gap:5px; font-size:13px; color:var(--texto-claro); }
.idade.visivel{ display:inline-flex; }
.linha-conv .idade input{ width:62px; padding:4px 8px; font-size:14px; }
.remover{ border:0; background:none; cursor:pointer; color:var(--texto-claro); font-size:20px; line-height:1; padding:4px 6px; border-radius:8px; }
.remover:hover{ color:#BE123C; background:#FFE4E6; }
.resumo-conv{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:18px; }
.resumo-conv span{ color:var(--texto-claro); }
details.varios-box{ margin-top:14px; }
.contatos{ border:1px solid var(--borda); border-radius:12px; padding:14px; margin-top:10px; background:var(--fundo-suave); }
.contatos .filtros{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.contatos .filtros input, .contatos .filtros select{ font:inherit; font-size:15px; border:1.5px solid var(--borda); border-radius:10px; padding:8px 10px; background:#fff; width:100%; }
.lista-contatos{ list-style:none; max-height:320px; overflow:auto; margin:10px 0; background:#fff; border:1px solid var(--borda); border-radius:10px; }
.lista-contatos li{ display:flex; align-items:center; border-bottom:1px solid var(--borda); }
.lista-contatos li label{ flex:1; border-bottom:0 !important; }
.lista-contatos .esquecer{ border:0; background:none; cursor:pointer; color:var(--texto-claro); font-size:16px; padding:6px 12px; border-radius:8px; }
.lista-contatos .esquecer:hover{ color:#BE123C; background:#FFE4E6; }
.lista-contatos label{ display:flex; gap:10px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--borda); cursor:pointer; }
.lista-contatos label:hover{ background:var(--ciano-claro); }
.lista-contatos input{ width:18px; height:18px; accent-color:var(--ciano); flex-shrink:0; }
.lista-contatos .nm{ flex:1; }
.lista-contatos small{ color:var(--texto-claro); font-size:13px; white-space:nowrap; }
.contatos .acoes-c{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
@media (max-width:600px){ .contatos .filtros{ grid-template-columns:1fr; } .lista-contatos small{ display:none; } }
details.varios-box summary{ cursor:pointer; color:var(--ciano-escuro); font-weight:500; }
textarea.varios{ min-height:120px; margin:10px 0; }

/* Enviar em sequência */
.seq-inicio{ display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    border:1.5px solid #86EFAC; background:#F0FDF4; border-radius:14px; padding:12px 16px; margin-bottom:16px; }
.seq-inicio span{ font-size:15px; color:#14532D; }
.seq-inicio small{ display:block; font-size:13px; color:var(--texto-claro); }
.seq-inicio.parado{ border-color:var(--borda); background:var(--fundo-suave); }
.seq-inicio.parado span{ color:var(--marinho); }
.b.verde{ background:#25D366; border-color:#25D366; color:#fff; font-weight:600; }
.b.verde:hover{ background:#1DA851; border-color:#1DA851; }
.seq{ position:fixed; inset:0; z-index:70; background:rgba(8,18,46,.62); display:flex; align-items:center; justify-content:center; padding:16px 16px 72px; }
.seq-caixa{ background:var(--branco); border-radius:20px; width:100%; max-width:440px; max-height:100%; overflow:auto; padding:20px 20px 18px;
    box-shadow:0 20px 60px rgba(8,18,46,.35); }
.seq-topo{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.seq-topo b{ font:700 18px "Montserrat",sans-serif; color:var(--marinho); }
.seq-topo small{ display:block; font-size:13px; color:var(--texto-claro); }
.seq-prog{ height:12px; border-radius:999px; background:var(--fundo-suave); overflow:hidden; margin:16px 0 6px; }
.seq-prog i{ display:block; height:100%; background:#25D366; transition:width .3s; }
.seq-conta{ display:flex; justify-content:space-between; font-size:14px; color:var(--texto-claro); }
.seq-conta b{ color:var(--marinho); }
.seq-pessoa{ text-align:center; margin:20px 0 14px; }
.seq-pessoa small{ display:block; font-size:13px; color:var(--texto-claro); text-transform:uppercase; letter-spacing:1px; }
.seq-pessoa strong{ display:block; font:800 24px/1.2 "Montserrat",sans-serif; color:var(--marinho); margin:4px 0 2px; overflow-wrap:anywhere; }
.seq-pessoa span{ color:var(--texto-claro); }
.seq-enviar{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; text-decoration:none; text-align:center;
    background:#25D366; color:#fff; border-radius:16px; padding:18px 14px; font:700 18px "Montserrat",sans-serif; }
.seq-enviar:hover{ background:#1DA851; }
.seq-enviar svg{ width:26px; height:26px; flex-shrink:0; }
.seq-acoes{ display:flex; justify-content:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
.seq-ultimo{ margin-top:16px; border-radius:12px; background:var(--ciano-claro); color:var(--marinho); padding:10px 12px; font-size:14px; }
.seq-ultimo a, .seq-ultimo button{ color:var(--ciano-escuro); font:inherit; font-weight:500; background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; }
.seq-fim{ text-align:center; margin:22px 0 8px; }
.seq-fim .e{ font-size:52px; display:block; }
.seq-fim strong{ display:block; font:800 22px "Montserrat",sans-serif; color:var(--marinho); margin:6px 0; }
.seq-dica{ margin-top:14px; font-size:13px; color:var(--texto-claro); }
body.seq-aberto{ overflow:hidden; }

/* Respostas (dashboard) */
.filtros-tarefas{ display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 4px; }
.filtro-t{ border:1.5px solid var(--borda); background:var(--branco); border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; color:var(--texto); cursor:pointer; }
.filtro-t b{ display:inline-block; min-width:22px; padding:0 6px; margin-left:4px; border-radius:999px; background:var(--fundo-suave); font-size:12px; }
.filtro-t:hover{ border-color:var(--ciano); }
.filtro-t.ativa{ background:var(--marinho); border-color:var(--marinho); color:var(--branco); font-weight:600; }
.filtro-t.ativa b{ background:rgba(255,255,255,.2); }
.filtro-t.f-atrasadas:not(.ativa) b{ background:#FFE4E6; color:#BE123C; }
.faixa-concluida{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 0; padding:10px 14px; border-radius:12px; background:#ECFDF5; border:1px solid #A7F3D0; font-size:14px; }
.faixa-concluida span{ flex:1 1 200px; }
.linha-tarefa.saindo{ opacity:0; transform:translateX(30px); transition:opacity .3s, transform .3s; }
.totais{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.total{ border-radius:14px; padding:14px 16px; border:1.5px solid var(--borda); background:var(--branco); }
.total b{ display:block; font:800 34px/1.1 "Montserrat",sans-serif; color:var(--marinho); }
.total span{ font-size:14px; color:var(--texto-claro); }
.total small{ display:block; font-size:12px; color:var(--texto-claro); margin-top:4px; }
.total.vai{ border-color:#86EFAC; background:#F0FDF4; } .total.vai b{ color:#15803D; }
.total.nao{ border-color:#FDA4AF; background:#FFF1F2; } .total.nao b{ color:#BE123C; }
.total.sem{ border-color:#FCD34D; background:#FFFBEB; } .total.sem b{ color:#B45309; }
.barra-resp{ display:flex; height:10px; border-radius:999px; overflow:hidden; background:var(--fundo-suave); margin:14px 0 4px; }
.barra-resp i{ display:block; height:100%; }
.tabela-resp{ width:100%; border-collapse:collapse; margin-top:16px; font-size:15px; }
.tabela-resp th, .tabela-resp td{ padding:8px 10px; border-bottom:1px solid var(--borda); text-align:center; }
.tabela-resp th{ font:600 13px "Montserrat",sans-serif; color:var(--texto-claro); }
.tabela-resp th:first-child, .tabela-resp td:first-child{ text-align:left; }
.tabela-resp td.v{ color:#15803D; font-weight:500; } .tabela-resp td.x{ color:#BE123C; font-weight:500; } .tabela-resp td.s{ color:#B45309; font-weight:500; }
.tabela-resp tr.soma td{ font-weight:700; border-bottom:0; }
.subtitulo-resp{ font:700 13px "Montserrat",sans-serif; letter-spacing:1px; text-transform:uppercase; color:var(--ciano-escuro);
    margin:26px 0 10px; padding-top:18px; border-top:1px solid var(--borda); }
.subtitulo-resp:first-child{ margin-top:0; padding-top:0; border-top:0; }
.filtros-resp{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.filtros-resp .opcoes button{ padding:6px 13px; font-size:14px; }
.colunas-resp{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-top:14px; }
.coluna-resp{ border:1.5px solid var(--borda); border-radius:14px; overflow:hidden; background:var(--branco); }
.coluna-resp h3{ font:700 15px "Montserrat",sans-serif; padding:10px 14px; display:flex; justify-content:space-between; gap:8px; }
.coluna-resp.vai h3{ background:#DCFCE7; color:#14532D; }
.coluna-resp.nao h3{ background:#FFE4E6; color:#881337; }
.coluna-resp.sem h3{ background:#FEF3C7; color:#78350F; }
.coluna-resp ol{ list-style:none; margin:0; padding:4px 0; max-height:460px; overflow:auto; }
.coluna-resp li{ padding:7px 14px; border-bottom:1px dashed var(--borda); font-size:15px; }
.coluna-resp li:last-child{ border-bottom:0; }
.coluna-resp li small{ display:block; font-size:12px; color:var(--texto-claro); }
.coluna-resp .vazio{ padding:14px; color:var(--texto-claro); font-size:14px; }
@media (max-width:760px){
    .totais{ grid-template-columns:1fr 1fr; }
    .colunas-resp{ grid-template-columns:1fr; }

.editar-convite summary small{ color:#B45309; font-weight:500; }
.editar-convite textarea{ width:100%; box-sizing:border-box; min-height:260px; margin-top:6px; font:15px/1.45 "Ubuntu",sans-serif; border:1.5px solid var(--borda); border-radius:10px; padding:10px 12px; resize:vertical; }
.ver-convite summary{ cursor:pointer; color:var(--ciano-escuro); font-weight:500; margin-bottom:8px; }
.tema-linha{ display:flex; gap:8px; flex-wrap:wrap; }
.tema-linha input{ flex:1 1 240px; font:inherit; font-size:16px; border:1.5px solid var(--borda); border-radius:10px; padding:9px 12px; }
.tema-linha input:focus{ outline:none; border-color:var(--ciano); box-shadow:0 0 0 3px rgba(0,173,239,.18); }
.tema-status{ font-size:14px; margin:8px 0 6px; }

/* Fornecedores */
.add-forn{ display:grid; grid-template-columns:230px 1.4fr 1fr auto; gap:10px; }
.add-forn input, .add-forn select, .linha-forn input, .linha-forn select{ font:inherit; font-size:15px; color:var(--texto); border:1.5px solid var(--borda); border-radius:10px; padding:8px 10px; background:var(--branco); min-width:0; width:100%; }
.add-forn input:focus, .linha-forn input:focus, .linha-forn select:focus{ outline:none; border-color:var(--ciano); box-shadow:0 0 0 3px rgba(0,173,239,.18); }
.reusar-forn{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.reusar-forn .rotulo small{ display:block; font-weight:400; color:var(--texto-claro); font-size:12px; }
.chip-agenda{ display:inline-flex; align-items:center; gap:2px; }
.chip-agenda .esquecer-ag{ border:0; background:none; color:var(--texto-claro); font-size:17px; line-height:1; padding:2px 5px; cursor:pointer; border-radius:6px; }
.chip-agenda .esquecer-ag:hover{ color:#B91C1C; background:#FEE2E2; }
.chips-forn{ display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
.chips-forn span{ background:var(--fundo-suave); border-radius:999px; padding:4px 11px; font-size:13px; }
.linhas-forn{ list-style:none; margin:12px 0 0; padding:0; border-top:1px solid var(--borda); }
.linha-forn{ display:grid; grid-template-columns:210px 1.4fr 1fr auto 34px; gap:8px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--borda); }
.linha-forn .obs{ grid-column:1 / 4; }
.linha-forn .valor{ grid-column:4; width:130px; }
.linha-forn .marca{ grid-column:5; justify-self:start; }
@media (max-width:760px){
    .info-tarefa{ margin-left:0; margin-right:0; padding:12px; }
    .add-forn{ grid-template-columns:1fr; }
    .linha-forn{ grid-template-columns:1fr 1fr 34px; }
    .linha-forn select{ grid-column:1 / 3; }
    .linha-forn input[data-fo="nome"]{ grid-column:1 / -1; }
    .linha-forn .remover{ grid-column:3; grid-row:1; }
    .linha-forn .obs{ grid-column:1 / -1; }
    .linha-forn .valor{ grid-column:1; width:100%; }
    .linha-forn .marca{ grid-column:2 / -1; }
}

/* Mensagens */
.aviso{ padding:28px; }
.aviso h2{ font-size:22px; margin-bottom:10px; }
.aviso p{ margin-bottom:10px; }
.aviso ol{ margin:10px 0 0 22px; }
.aviso li{ margin-bottom:6px; }
.entrar{ max-width:420px; margin:30px auto; display:flex; flex-direction:column; gap:12px; }
.entrar input{ font:inherit; font-size:17px; border:1.5px solid var(--borda); border-radius:10px; padding:12px 14px; }
.entrar input:focus{ outline:none; border-color:var(--ciano); box-shadow:0 0 0 3px rgba(0,173,239,.18); }
.erro-senha{ color:#BE123C; min-height:1.4em; margin:0; }
.faixa-aviso{ background:#FEF3C7; color:#78350F; border:1px solid #FDE68A; border-radius:12px; padding:12px 16px; margin-bottom:18px; font-size:15px; }

/* Barra de salvar */
.barra{ position:fixed; left:0; right:0; bottom:0; z-index:80; background:var(--marinho); color:#DCE6F7;
    box-shadow:0 -8px 24px rgba(8,18,46,.25); transform:translateY(100%); transition:transform .25s; }
.barra.visivel{ transform:none; }
.barra .wrap{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; }
.barra .estado{ font-size:15px; }
.barra .estado.erro{ color:#FDA4AF; }
.barra .b{ background:var(--ciano); color:#fff; border-color:var(--ciano); }

@media (max-width:900px){
    .painel{ grid-template-columns:1fr; }
    .lateral{ position:static; max-height:none; }
    .lateral .itens{ max-height:300px; }
}
@media (max-width:600px){
    .campo.m3, .campo.m2{ grid-column:span 6; }
    .editor-topo, .abas, .conteudo-aba{ padding-left:16px; padding-right:16px; }
    .add-conv{ grid-template-columns:1fr; }
    .linha-conv{ grid-template-columns:22px 1fr auto; }
    .linha-conv input[data-c="nome"], .linha-conv input[data-c="whats"]{ grid-column:2 / span 2; }
    .quem{ text-align:left; }
    .linha-conv .convite{ grid-column:2; justify-self:start; }
    .marcas{ grid-column:1 / -1; padding-left:32px; }
}

<body data-pagina="eventos" data-sem-whats>

<div id="topo"></div>

<header class="cabecalho">
    <div class="wrap">
        <div>
            <span class="cadeado">🔒 Área privada</span>
            <h1>Painel do organizador</h1>
        </div>
        <div class="quem" id="quem"></div>
    </div>
</header>

<main class="wrap painel" id="painel">
    <div class="caixa aviso" style="grid-column:1 / -1">Carregando...</div>
</main>

<div class="barra" id="barra">
    <div class="wrap">
        <span class="estado" id="estado">Alterações não salvas</span>
        <button class="b" id="salvar">Salvar alterações</button>
    </div>
</div>

<script src="/assets/js/site.js"></script>
<script src="/assets/js/eventos-comum.js?v=20261103a"></script>
<!-- Eventos do arquivo do site: usados só na primeira vez, para começar o painel -->
<script src="/eventos/eventos.js"></script>
<script>
(function () {
    var esc = EV.esc, I = window.ICONES;
    var DO_ARQUIVO = (window.EVENTOS || []).slice();

    var estado = { eventos: [], convidados: {}, tarefas: {}, tarefasPadrao: null, tarefasPadraoSabado: null, fornecedores: {}, agenda: [], versao: "" };
    var atual = null;          // id do evento aberto
    var aba = "detalhes";
    var sujo = false;
    var painel = document.getElementById("painel");

    /* ---------------- Utilidades ---------------- */

    function copia(o) { return JSON.parse(JSON.stringify(o)); }

    /* Link para a página do evento. Em rascunho a página pública não mostra o evento:
       aí o botão abre a prévia (só no painel, com o que está na tela, mesmo sem salvar). */
    function linkPagina(ev, texto, ancora) {
        if (ev.rascunho) return '<button class="b pequeno" data-acao="previa">👁️ Ver prévia</button>';
        return '<a class="b pequeno" href="/eventos/evento?id=' + encodeURIComponent(ev.id) + (ancora || "") + '" target="_blank" rel="noopener">' + texto + '</a>';
    }

    /* Prévia: abre a página do evento por cima do painel, como os convidados vão ver.
       O evento vai direto desta janela para a página (window.__previaEvento): não é salvo nem publicado. */
    function abrirPrevia(ev) {
        var dados = copia(ev);
        delete dados._novo; delete dados._ini; delete dados.rascunho;
        window.__previaEvento = dados;
        var caixa = document.getElementById("previa");
        if (!caixa) {
            caixa = document.createElement("div");
            caixa.id = "previa";
            caixa.setAttribute("role", "dialog");
            caixa.setAttribute("aria-label", "Prévia do evento");
            caixa.innerHTML = '<div class="previa-barra"><span><b>👁️ Prévia</b> <span class="previa-nota"></span></span>' +
                '<button class="b pequeno" data-fechar-previa>✕ Fechar prévia</button></div><iframe title="Prévia da página do evento"></iframe>';
            document.body.appendChild(caixa);
            caixa.querySelector("[data-fechar-previa]").onclick = fecharPrevia;
            document.addEventListener("keydown", function (e) { if (e.key === "Escape" && caixa.classList.contains("aberta")) fecharPrevia(); });
        }
        caixa.querySelector(".previa-nota").textContent = "Assim os convidados vão ver (mesmo sem salvar). É rascunho: fica fora da lista de eventos, só abre pelo link do convite.";
        caixa.querySelector("iframe").src = "/eventos/evento?previa=1&id=" + encodeURIComponent(ev.id) + "&t=" + Date.now();
        caixa.classList.add("aberta");
        document.body.style.overflow = "hidden";
    }
    function fecharPrevia() {
        var caixa = document.getElementById("previa");
        if (!caixa) return;
        caixa.classList.remove("aberta");
        caixa.querySelector("iframe").src = "about:blank";
        document.body.style.overflow = "";
    }

    function slug(t) {
        return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
            .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "evento";
    }
    function idLivre(base, ignorar) {
        var id = base, n = 2;
        while (estado.eventos.some(function (e) { return e.id === id && e !== ignorar; })) id = base + "-" + n++;
        return id;
    }
    function evento(id) { return estado.eventos.filter(function (e) { return e.id === id; })[0] || null; }
    function convidados(id) { return estado.convidados[id] || (estado.convidados[id] = []); }

    function numero(w) {
        var d = String(w || "").replace(/\D/g, "");
        if (!d) return "";
        return d.length <= 11 ? "55" + d : d;
    }
    /* Código do link de confirmação de cada convidado */
    function novoCodigo() {
        var letras = "abcdefghjkmnpqrstuvwxyz23456789", a = crypto.getRandomValues(new Uint8Array(10)), t = "";
        for (var i = 0; i < a.length; i++) t += letras[a[i] % letras.length];
        return t;
    }
    /* Festa com almoço = churrasco americano: cada convidado traz carne e bebida para partilhar.
       Vale sempre que "Almoço" estiver marcado em Compras ("Vai ter na festa"). */
    var FRASE_CHURRASCO = "🍖 Vai ter almoço com *churrasco americano*: cada um traz a sua carne e a sua bebida para a gente partilhar!";
    function temAlmoco(ev) { return !!(ev && ev.id && itensCompras(ev).almoco); }
    function linhaChurrasco(ev) { return temAlmoco(ev) ? FRASE_CHURRASCO + "\n" : ""; }
    /* Festa simples: o convite e a descrição só falam de bolo, salgados e doces quando estão marcados em Compras ("Vai ter na festa") */
    function fraseFesta(ev) {
        var tem = itensCompras(ev), it = [];
        if (tem.bolo) it.push("bolo");
        if (tem.salgados) it.push("salgados");
        if (tem.doces) it.push("doces");
        var lista = it.length > 1 ? it.slice(0, -1).join(", ") + " e " + it[it.length - 1] : it[0];
        return "Vai ser uma festa simples" + (lista ? ", com " + lista : "") + ", feita com muito carinho.";
    }
    function linhaFesta(ev) {
        if (!ev || !ev.id) return "";
        return (itensCompras(ev).bolo ? "🎂 " : "🎈 ") + fraseFesta(ev) + "\n";
    }
    /* Frase automática dentro da descrição (a antiga, que sempre falava em salgadinhos, e a nova) */
    var RE_FRASE_FESTA = /Vai ter bolo, salgadinhos e muita alegria\.|Vai ser uma festa simples[^.\n]*\./;
    function descricaoSegueItens(ev) {
        var d = String(ev.descricao || "");
        if (!RE_FRASE_FESTA.test(d)) return false;
        var r = d.replace(RE_FRASE_FESTA, fraseFesta(ev));
        if (r === d) return false;
        ev.descricao = r;
        document.querySelectorAll('[data-c="descricao"]').forEach(function (el) { if (el.value !== r) el.value = r; });
        return true;
    }
    /* Convite automático, com o nome e o link de quem vai receber */
    function conviteAuto(ev, nome, link, comCodigo) {
        return "Olá, " + nome + "! " + emojiConvite(ev) + "\n" +
            "Você está convidado(a) para *" + ev.titulo + "*.\n\n" +
            "📅 " + EV.dataLonga(ev) + (ev.hora ? ", às " + ev.hora : "") + "\n" +
            (ev.local ? "📍 " + ev.local + (ev.endereco ? " (" + ev.endereco + ")" : "") + "\n" : "") +
            linhaFesta(ev) +
            linhaChurrasco(ev) +
            (comCodigo ? "\n👉 *Confirme sua presença* (é só tocar em Vou ou Não vou) e veja mapa, previsão do tempo e playlist:\n"
                : "\nTodos os detalhes, mapa, previsão do tempo e playlist:\n") + link + "\n\nConto com você!";
    }
    /* Convite editado à mão (campo conviteTexto): [nome] vira o primeiro nome e [link] o link de confirmação de cada um.
       Sem [link] no texto, o link entra no final (sem ele a pessoa não consegue confirmar). */
    function conviteEditado(ev, nome, link) {
        var t = String(ev.conviteTexto).split("[nome]").join(nome);
        return t.indexOf("[link]") >= 0 ? t.split("[link]").join(link) : t.replace(/\s+$/, "") + "\n\n👉 Confirme sua presença aqui:\n" + link;
    }
    /* Texto que aparece no "Editar o convite" quando ele ainda não foi mudado */
    function modeloConvite(ev) {
        return conviteAuto(ev, "[nome]", "[link]", true);
    }
    function textoConvite(ev, p) {
        var nome = String(p.nome).trim().split(" ")[0];
        var link = window.AZUL.site + "/eventos/evento?id=" + encodeURIComponent(ev.id) + (p.c ? "&c=" + p.c : "");
        if (String(ev.conviteTexto || "").trim()) return conviteEditado(ev, nome, link);
        return conviteAuto(ev, nome, link, !!p.c);
    }
    /* Caixa "Editar o convite" (tarefas do convite e aba Detalhes) */
    function editorConviteHTML(ev) {
        var mudou = !!String(ev.conviteTexto || "").trim();
        return '<details class="editar-convite"' + (mudou ? " open" : "") + '><summary>✏️ Editar o convite' + (mudou ? " <small>(texto mudado por você)</small>" : "") + '</summary>' +
            '<p class="nota-info">Mude o texto como quiser. Onde estiver <b>[nome]</b> entra o primeiro nome de cada convidado, e onde estiver <b>[link]</b> entra o link para ele tocar em <b>Vou</b> ou <b>Não vou</b>. Depois toque em <b>Salvar alterações</b>.</p>' +
            '<textarea data-c="conviteTexto" rows="13" aria-label="Texto do convite">' + esc(mudou ? ev.conviteTexto : modeloConvite(ev)) + '</textarea>' +
            '<p class="nota-info">⚠️ Depois de mudar o texto, mudar a data, o local ou o que vai ter na festa <b>não muda mais o convite sozinho</b>. Para voltar ao texto automático, toque no botão abaixo.</p>' +
            '<div class="acoes-info"><button class="b pequeno" data-acao="convite-auto">↩️ Voltar ao texto automático</button></div></details>';
    }

    function marcarSujo() {
        sujo = true;
        mostrarBarra("Alterações não salvas", false);
    }
    function mostrarBarra(texto, erro) {
        var b = document.getElementById("barra"), e = document.getElementById("estado");
        e.textContent = texto;
        e.className = "estado" + (erro ? " erro" : "");
        b.classList.add("visivel");
    }

    /* Limpa campos vazios antes de salvar */
    function limpo(ev) {
        var o = {};
        Object.keys(ev).forEach(function (k) {
            var v = ev[k];
            if (v === "" || v == null || v === false) return;
            if (Array.isArray(v) && !v.length && k !== "fotos") return;
            o[k] = v;
        });
        if (!o.fotos) o.fotos = [];
        return o;
    }

    /* ---------------- Carregar ---------------- */

    function avisoConfig(titulo, texto) {
        painel.innerHTML = '<div class="caixa aviso" style="grid-column:1 / -1"><h2>' + titulo + '</h2>' + texto +
            '<p style="margin-top:16px;color:var(--texto-claro);font-size:14px">O passo a passo completo está no arquivo LEIAME.md do site, na parte "Painel do organizador".</p></div>';
    }

    function telaSenha(erro) {
        painel.innerHTML = '<form class="caixa aviso entrar" id="form-senha" style="grid-column:1 / -1">' +
            '<h2>🔒 Entrar no painel</h2><p>Digite a senha do organizador.</p>' +
            '<input type="password" id="senha" autocomplete="current-password" placeholder="Senha" required>' +
            '<button class="b cheio" type="submit">Entrar</button>' +
            '<p class="erro-senha" id="erro-senha">' + esc(erro || "") + '</p></form>';
        var f = document.getElementById("form-senha"), campo = document.getElementById("senha");
        campo.focus();
        f.addEventListener("submit", function (e) {
            e.preventDefault();
            var botao = f.querySelector("button");
            botao.disabled = true;
            fetch("/api/admin/login", {
                method: "POST", credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ senha: campo.value })
            })
            .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); })
            .then(function (d) {
                if (d._status === 200) return carregar();
                document.getElementById("erro-senha").textContent = d.erro || "Não consegui entrar.";
                campo.select();
            })
            .catch(function () { document.getElementById("erro-senha").textContent = "Sem conexão. Tente de novo."; })
            .then(function () { botao.disabled = false; });
        });
    }

    function sair(e) {
        if (e) e.preventDefault();
        if (sujo && !confirm("Há alterações não salvas. Sair mesmo assim?")) return;
        sujo = false;
        fetch("/api/admin/sair", { method: "POST", credentials: "same-origin" })
            .then(function () { location.reload(); }, function () { location.reload(); });
    }

    function carregar() {
    fetch("/api/admin/dados", { credentials: "same-origin", cache: "no-store" })
        .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; });
        })
        .then(function (d) {
            if (d._status === 200) return iniciar(d);
            if (d.codigo === "senha") return telaSenha();
            if (d.codigo === "sem-login") {
                avisoConfig("Falta ligar o login do painel",
                    '<p>O painel está pronto, mas ainda falta configurar no Cloudflare (projeto azulmarinho-site → Settings):</p><ol>' +
                    '<li>Em <b>Variables and Secrets</b>, a senha do painel: <code>ADMIN_SENHA</code> (tipo Secret).</li>' +
                    '<li>Em <b>Bindings</b>, o armazenamento KV com o nome <code>DADOS</code>.</li></ol>');
            } else if (d.codigo === "sem-kv") {
                avisoConfig("Falta ligar o armazenamento",
                    '<p>O login está funcionando. Agora é só criar o KV no Cloudflare e ligar ao site com o nome <code>DADOS</code>.</p>');
            } else if (d._status === 401 || d._status === 403) {
                avisoConfig("Acesso não autorizado",
                    '<p>' + esc(d.erro || "Faça login com o e-mail do organizador.") + '</p>' +
                    '<p><a class="b" href="/cdn-cgi/access/logout">Sair e entrar de novo</a></p>');
            } else {
                avisoConfig("O painel só funciona no site publicado",
                    '<p>Não consegui falar com o servidor do painel (' + (d._status || "sem resposta") + '). Abra pelo endereço do site no Cloudflare.</p>');
            }
        })
        .catch(function () {
            avisoConfig("Sem conexão", "<p>Não consegui carregar os dados do painel. Verifique a internet e recarregue a página.</p>");
        });
    }
    carregar();

    /* Respostas que os convidados deram pelo link do convite.
       Cada resposta é aplicada uma vez (respEm); depois disso vale o que você marcar no painel. */
    function aplicarRespostas(respostas) {
        var novas = 0;
        Object.keys(respostas).forEach(function (id) {
            (estado.convidados[id] || []).forEach(function (p) {
                var r = p.c && respostas[id][p.c];
                if (!r || !r.em || p.respEm === r.em) return;
                p.respEm = r.em; p.enviado = true;
                if (r.r === "sim") { p.confirmado = true; delete p.naoVai; }
                else { p.naoVai = true; delete p.confirmado; }
                novas++;
            });
        });
        return novas;
    }

    function iniciar(d) {
        var primeiraVez = !Array.isArray(d.eventos);
        estado.eventos = primeiraVez ? copia(DO_ARQUIVO) : d.eventos;
        estado.convidados = d.convidados || {};
        estado.tarefas = d.tarefas || {};
        separarRefriCarne();
        estado.fornecedores = d.fornecedores && typeof d.fornecedores === "object" ? d.fornecedores : {};
        iniciarAgenda(d.agendaFornecedores);
        estado.tarefasPadrao = Array.isArray(d.tarefasPadrao) ? d.tarefasPadrao : null;
        estado.tarefasPadraoSabado = Array.isArray(d.tarefasPadraoSabado) ? d.tarefasPadraoSabado : null;
        incluirSelecionarConvidados();
        estado.versao = d.versao || "";
        var novas = aplicarRespostas(d.respostas || {});
        window.EVENTOS = estado.eventos;

        var quem = document.getElementById("quem");
        if (d.modo === "senha") {
            quem.innerHTML = '<a href="#" id="sair">Sair do painel</a>';
            document.getElementById("sair").addEventListener("click", sair);
        } else if (d.email) {
            quem.innerHTML = 'Entrou como <b>' + esc(d.email) + '</b><br><a href="/cdn-cgi/access/logout">Sair</a>';
        }

        var pedido = decodeURIComponent(location.hash.slice(1));
        atual = evento(pedido) ? pedido : null;
        /* O toque no aviso do celular abre /admin/?aba=tarefas#evento */
        var abaPedida = new URLSearchParams(location.search).get("aba");
        if (atual && /^(detalhes|fornecedores|compras|convidados|respostas|tarefas)$/.test(abaPedida || "")) aba = abaPedida;

        desenhar();
        carregarPiscina();
        carregarAvisoCel();
        if (novas) mostrarBarra(novas + (novas === 1 ? " convidado respondeu" : " convidados responderam") + " pelo link do convite (já marcado na lista).", false);
        if (primeiraVez) {
            marcarSujo();
            mostrarBarra("Primeira vez: carreguei os " + estado.eventos.length + " eventos do site. Clique em Salvar para guardar no painel.", false);
        }
    }

    /* ---------------- Desenho ---------------- */

    /* Sem evento aberto: só a lista para escolher. Com evento aberto: só o evento, com "Escolher outro evento" no topo. */
    function desenhar() {
        window.EVENTOS = estado.eventos;
        var aberto = !!(atual && evento(atual));
        painel.classList.toggle("so-lista", !aberto);
        painel.classList.toggle("com-evento", aberto);
        painel.innerHTML = aberto
            ? '<div class="voltar-lista"><button class="b pequeno" data-acao="voltar-lista">← Escolher outro evento</button></div>' +
              '<section class="caixa" id="editor">' + editorHTML() + '</section>'
            : '<h2 class="titulo-lista">Escolha um evento</h2>' +
              '<aside class="caixa lateral">' +
                '<div class="topo-lista"><button class="b cheio largo" data-acao="novo">＋ Novo evento</button></div>' +
                '<div class="itens">' + listaHTML() + '</div>' +
              '</aside>' +
              '<p class="nota-lista">Toque em um evento para ver os detalhes, os convidados, as compras e as tarefas dele.</p>';
        ligarEditor();
    }

    function listaHTML() {
        var g = EV.separar();
        function item(ev) {
            var t = EV.tema(ev);
            return '<button class="item' + (ev.id === atual ? " ativo" : "") + '" data-abrir="' + esc(ev.id) + '">' +
                '<span class="emo">' + t.emoji + '</span><span><b>' + esc(ev.titulo || "(sem título)") +
                (ev.rascunho ? '<span class="selo">rascunho</span>' : "") + '</b>' +
                '<small>' + (ev.data ? EV.dataCurta(ev) : "sem data") + " • " + convidados(ev.id).length + ' conv.</small></span></button>';
        }
        var html = "";
        if (g.proximos.length) html += '<div class="grupo">Próximos</div>' + g.proximos.map(item).join("");
        if (g.passados.length) html += '<div class="grupo">Já aconteceram</div>' + g.passados.map(item).join("");
        return html || '<p style="padding:16px;color:var(--texto-claro)">Nenhum evento ainda.</p>';
    }

    function acoesTopoHTML(ev) {
        return (ev.rascunho ? '<button class="b pequeno cheio" data-acao="previa">👁️ Ver prévia</button>'
                : '<a class="b pequeno" href="/eventos/evento?id=' + encodeURIComponent(ev.id) + '" target="_blank" rel="noopener">Ver página</a>') +
            '<button class="b pequeno" data-acao="duplicar">Duplicar</button>' +
            '<button class="b pequeno perigo" data-acao="excluir">Excluir</button>';
    }

    function editorHTML() {
        var ev = atual && evento(atual);
        if (!ev) {
            return '<div class="aviso"><h2>Escolha um evento</h2><p>Clique em um evento da lista para editar os detalhes e os convidados, ou em <b>Novo evento</b> para criar um.</p>' +
                '<p style="color:var(--texto-claro)">Depois de mexer, clique em <b>Salvar alterações</b> na barra de baixo. O site atualiza em até 1 minuto.</p></div>';
        }
        var qtd = convidados(ev.id).length;
        return '<div class="editor-topo"><h2>' + esc(ev.titulo || "Novo evento") + '</h2><div class="acoes">' + acoesTopoHTML(ev) + '</div></div>' + avisoConferirHTML(ev) +
            '<div class="abas"><button data-aba="detalhes" class="' + (aba === "detalhes" ? "ativa" : "") + '">Detalhes</button>' +
                '<button data-aba="fornecedores" class="' + (aba === "fornecedores" ? "ativa" : "") + '">Fornecedores' + (fornecedores(ev.id).length ? " (" + fornecedores(ev.id).length + ")" : "") + '</button>' +
                '<button data-aba="compras" class="' + (aba === "compras" ? "ativa" : "") + '">Compras</button>' +
                '<button data-aba="convidados" class="' + (aba === "convidados" ? "ativa" : "") + '">Convidados (' + qtd + ')</button>' +
                '<button data-aba="respostas" class="' + (aba === "respostas" ? "ativa" : "") + '">Respostas</button>' +
                '<button data-aba="tarefas" class="' + (aba === "tarefas" ? "ativa" : "") + '">Tarefas</button></div>' +
            '<div class="conteudo-aba">' + faixaTarefasHTML(ev) + (aba === "detalhes" ? detalhesHTML(ev) : aba === "respostas" ? respostasHTML(ev) : aba === "compras" ? comprasHTML(ev) : aba === "tarefas" ? tarefasHTML(ev) : aba === "fornecedores" ? fornecedoresHTML(ev) : convidadosHTML(ev)) + '</div>';
    }

    /* ---------------- Respostas: quem vai, quem não vai, quem não respondeu ---------------- */

    var filtroResp = { sexo: "", tipo: "" };
    function situacao(p) { return p.confirmado ? "vai" : p.naoVai ? "nao" : "sem"; }
    function detalhePessoa(p) {
        var d = [];
        if (p.tipo === "crianca") d.push("Criança" + (p.idade !== undefined && p.idade !== "" ? ", " + p.idade + (+p.idade === 1 ? " ano" : " anos") : ""));
        else if (p.tipo === "adulto") d.push("Adulto");
        if (p.sexo === "m") d.push("Masculino"); else if (p.sexo === "f") d.push("Feminino");
        if (situacao(p) === "sem" && !p.enviado) d.push("convite ainda não enviado");
        if (p.respEm && situacao(p) !== "sem") d.push("📩 pelo link");
        return d.join(" • ");
    }

    function respostasHTML(ev) {
        var lista = convidados(ev.id).filter(function (p) { return String(p.nome || "").trim(); });
        if (!lista.length) return '<p style="color:var(--texto-claro)">Nenhum convidado ainda. Cadastre na aba <b>Convidados</b> e as respostas aparecem aqui.</p>';
        function conta(l, s) { return l.filter(function (p) { return situacao(p) === s; }).length; }
        function pct(n) { return lista.length ? Math.round(n * 100 / lista.length) : 0; }
        var vai = conta(lista, "vai"), nao = conta(lista, "nao"), sem = conta(lista, "sem");
        var naoEnviados = lista.filter(function (p) { return situacao(p) === "sem" && !p.enviado; }).length;

        /* Totais */
        var html = '<div class="subtitulo-resp">Totais</div>' +
            '<div class="totais">' +
                '<div class="total vai"><b>' + vai + '</b><span>✅ Vão</span><small>' + pct(vai) + '% da lista</small></div>' +
                '<div class="total nao"><b>' + nao + '</b><span>❌ Não vão</span><small>' + pct(nao) + '% da lista</small></div>' +
                '<div class="total sem"><b>' + sem + '</b><span>⏳ Não responderam</span><small>' + (naoEnviados ? naoEnviados + " sem convite enviado" : pct(sem) + "% da lista") + '</small></div>' +
                '<div class="total"><b>' + lista.length + '</b><span>👥 Na lista</span><small>todos os convidados</small></div>' +
            '</div>' +
            '<div class="barra-resp" aria-hidden="true"><i style="width:' + (vai * 100 / lista.length) + '%;background:#22C55E"></i>' +
                '<i style="width:' + (nao * 100 / lista.length) + '%;background:#F43F5E"></i><i style="width:' + (sem * 100 / lista.length) + '%;background:#FBBF24"></i></div>';

        /* Contagem por grupo */
        var grupos = [
            ["Adultos", function (p) { return p.tipo === "adulto"; }],
            ["Crianças", function (p) { return p.tipo === "crianca"; }],
            ["Homens", function (p) { return p.sexo === "m"; }],
            ["Mulheres", function (p) { return p.sexo === "f"; }]
        ];
        var semTipo = lista.filter(function (p) { return !p.tipo; }).length, semSexo = lista.filter(function (p) { return !p.sexo; }).length;
        if (semTipo) grupos.splice(2, 0, ["Sem adulto/criança marcado", function (p) { return !p.tipo; }]);
        if (semSexo) grupos.push(["Sem sexo marcado", function (p) { return !p.sexo; }]);
        html += '<table class="tabela-resp"><thead><tr><th>Grupo</th><th>✅ Vão</th><th>❌ Não vão</th><th>⏳ Não resp.</th><th>Total</th></tr></thead><tbody>' +
            grupos.map(function (g) {
                var l = lista.filter(g[1]);
                return '<tr><td>' + g[0] + '</td><td class="v">' + conta(l, "vai") + '</td><td class="x">' + conta(l, "nao") + '</td><td class="s">' + conta(l, "sem") + '</td><td>' + l.length + '</td></tr>';
            }).join("") +
            '<tr class="soma"><td>Todos</td><td class="v">' + vai + '</td><td class="x">' + nao + '</td><td class="s">' + sem + '</td><td>' + lista.length + '</td></tr>' +
            '</tbody></table>';

        /* Listas com filtro */
        function botao(campo, v, texto) {
            var on = filtroResp[campo] === v;
            return '<button type="button" data-filtro="' + campo + '" data-v="' + v + '"' + (on ? ' class="ativa" aria-pressed="true"' : ' aria-pressed="false"') + '>' + texto + '</button>';
        }
        var filtrada = lista.filter(function (p) {
            return (!filtroResp.sexo || p.sexo === filtroResp.sexo) && (!filtroResp.tipo || p.tipo === filtroResp.tipo);
        });
        function coluna(s, titulo) {
            var l = filtrada.filter(function (p) { return situacao(p) === s; })
                .sort(function (a, b) { return String(a.nome).localeCompare(String(b.nome), "pt-BR"); });
            return '<div class="coluna-resp ' + s + '"><h3><span>' + titulo + '</span><span>' + l.length + '</span></h3>' +
                (l.length ? '<ol>' + l.map(function (p) {
                    var d = detalhePessoa(p);
                    return '<li>' + esc(String(p.nome).trim()) + (d ? '<small>' + esc(d) + '</small>' : "") + '</li>';
                }).join("") + '</ol>' : '<p class="vazio">Ninguém aqui.</p>') + '</div>';
        }
        var temFiltro = filtroResp.sexo || filtroResp.tipo;
        html += '<div class="subtitulo-resp">Quem vai, quem não vai e quem não respondeu</div>' +
            '<div class="filtros-resp"><span class="rotulo">Mostrar:</span>' +
                '<span class="opcoes" role="group" aria-label="Filtrar por sexo">' + botao("sexo", "", "Todos") + botao("sexo", "m", "Homens") + botao("sexo", "f", "Mulheres") + '</span>' +
                '<span class="opcoes" role="group" aria-label="Filtrar por idade">' + botao("tipo", "", "Todos") + botao("tipo", "adulto", "Adultos") + botao("tipo", "crianca", "Crianças") + '</span>' +
                (temFiltro ? '<span style="color:var(--texto-claro);font-size:14px">' + filtrada.length + ' de ' + lista.length + ' convidados</span>' : "") +
            '</div>' +
            '<div class="colunas-resp">' + coluna("vai", "✅ Vão") + coluna("nao", "❌ Não vão") + coluna("sem", "⏳ Não responderam") + '</div>' +
            '<p style="margin-top:14px;color:var(--texto-claro);font-size:14px">As respostas pelo link do convite entram quando o painel é aberto. Para ver respostas novas, recarregue a página. ' +
                'Para mudar a resposta de alguém, use as marcas <b>Confirmado</b> e <b>Não vai</b> na aba Convidados.</p>';
        return html;
    }

    /* ---------------- Comes e bebes: lista de compras pelas quantidades de pessoas ---------------- */

    /* Regras de festa (por pessoa). Para mudar uma conta, mude só o número aqui.
       adulto = adulto, grande = criança de 6 anos ou mais, pequena = criança de 1 a 5 anos (bebê não entra). */
    var REGRAS = {
        /* Bebida em ml. Criança até 5 anos não bebe refri. Com almoço a festa é mais longa e bebe-se mais. */
        bebida: {
            dois:     { refri: { adulto: 600, grande: 400 }, suco: { adulto: 300, grande: 300, pequena: 400 } },
            doisAlm:  { refri: { adulto: 800, grande: 500 }, suco: { adulto: 400, grande: 400, pequena: 500 } },
            refri:    { refri: { adulto: 900, grande: 700 }, suco: {} },
            refriAlm: { refri: { adulto: 1200, grande: 1000 }, suco: {} },
            suco:     { refri: {}, suco: { adulto: 900, grande: 700, pequena: 400 } },
            sucoAlm:  { refri: {}, suco: { adulto: 1200, grande: 1000, pequena: 500 } }
        },
        salgados: { adulto: 15, grande: 10, pequena: 6 },        // unidades
        salgadosAlm: { adulto: 6, grande: 4, pequena: 3 },       // com almoço o salgado vira só entrada
        almoco: { adulto: 500, grande: 350, pequena: 200 },      // gramas de comida pronta (arroz, feijão, carne, salada...)
        carne: { adulto: 400, grande: 250, pequena: 150 },       // gramas de carne crua para o churrasco
        carvaoPorKgCarne: 1, sacoCarvao: 5,                      // 1 kg de carvão por kg de carne, sacos de 5 kg
        doces: { adulto: 6, grande: 5, pequena: 3 },            // docinhos por pessoa (encomenda de 25 em 25)
        lembrancinhaReserva: 0.1,                                // 10% a mais de lembrancinha
        bolo: 100,                                               // gramas por pessoa (1 fatia); bebê não come
        cadeiraIdade: 3,                                         // menores que isso ficam no colo
        cadeirasPorMesa: 4,
        coposDesc: 4, coposDescAlm: 5,
        guardanapos: 5, guardanaposAlm: 8,
        gelo: 2,                                                 // kg por pessoa (bebida gelada e caixa térmica no calor)
        pessoasPorPapelToalha: 10,                               // 1 rolo de papel-toalha a cada 10 pessoas
        reservaDesc: 0.2,                                        // 20% a mais de talher descartável (cai, quebra)
        folgaReutilizavel: 0.1                                   // 10% a mais de louça, para quebra e reposição
    };
    var baseCompras = "vai";
    var ITENS_COMPRA = [["refri", "🥤 Refri"], ["suco", "🧃 Suco"], ["bolo", "🎂 Bolo"], ["salgados", "🥟 Salgados"], ["almoco", "🍛 Almoço"], ["churrasco", "🍖 Churrasco"], ["doces", "🍬 Doces"], ["lembrancinhas", "🎁 Lembrancinhas"], ["personalizados", "🎨 Personalizados"]];

    /* O que vai ter na festa: tudo marcado (menos almoço), a não ser que tenha sido mudado neste aparelho. */
    function itensCompras(ev) {
        var tem = { refri: true, suco: true, bolo: true, salgados: true, almoco: false, churrasco: true, doces: true, lembrancinhas: true, personalizados: true };
        /* Guardado junto das tarefas do evento (vale em todos os aparelhos); antes ficava só neste aparelho */
        var tc = estado.tarefas[ev.id], salvo = tc && tc.tem;
        if (!salvo) try { salvo = JSON.parse(localStorage.getItem("compras:" + ev.id) || "{}"); } catch (e) { salvo = {}; }
        Object.keys(tem).forEach(function (k) { if (typeof salvo[k] === "boolean") tem[k] = salvo[k]; });
        return tem;
    }
    function marcarItemCompra(ev, item, valor) {
        var tem = itensCompras(ev);
        tem[item] = valor;
        cronograma(ev).tem = tem;
        marcarSujo();
        try { localStorage.setItem("compras:" + ev.id, JSON.stringify(tem)); } catch (e) {}
    }

    /* Tarefas que dependem do que vai ter na festa: desmarcou o item em Compras, a tarefa some (volta ao marcar de novo) */
    var ITENS_DA_TAREFA = [[/\bbolo\b|topo/, "bolo"], [/salgad/, "salgados"], [/doce/, "doces"], [/lembrancinha/, "lembrancinhas"], [/personalizad/, "personalizados"],
        [/refri/, "refri"], [/\bsuco\b/, "suco"], [/carne|carvao|churras/, "churrasco"], [/almoco|supermercado/, "almoco"],
        [/\bgelo\b|bebida/, "refri"], [/\bgelo\b|bebida/, "suco"]];   // gelo e gelar bebidas só somem se refri e suco estiverem desmarcados
    var NOMES_ITEM = { bolo: "Bolo", salgados: "Salgados", doces: "Doces", lembrancinhas: "Lembrancinhas", personalizados: "Personalizados", refri: "Refri", suco: "Suco", churrasco: "Churrasco", almoco: "Almoço" };
    function itensDesligados(ev, t, tem) {
        var k = chaveNome(t.t), usa = ITENS_DA_TAREFA.filter(function (x) { return x[0].test(k); }).map(function (x) { return x[1]; });
        return usa.length && usa.every(function (i) { return !tem[i]; }) ? usa : null;
    }
    function tarefasVisiveis(ev, c) {
        var tem = itensCompras(ev);
        return c.itens.filter(function (t) { return !itensDesligados(ev, t, tem); });
    }

    /* Separa as pessoas em adultos, crianças de 6 anos ou mais, de 1 a 5 anos e bebês (menos de 1 ano). */
    function gruposCompras(lista) {
        var g = { adulto: 0, grande: 0, pequena: 0, bebe: 0, colo: 0, semTipo: 0, semIdade: 0 };
        lista.forEach(function (p) {
            if (p.tipo !== "crianca") { g.adulto++; if (!p.tipo) g.semTipo++; return; }
            var idade = p.idade === undefined || p.idade === "" ? NaN : +p.idade;
            if (isNaN(idade)) { g.grande++; g.semIdade++; return; }
            if (idade < 1) g.bebe++;
            else if (idade <= 5) g.pequena++;
            else g.grande++;
            if (idade < REGRAS.cadeiraIdade) g.colo++;
        });
        return g;
    }

    /* Regras de bebida conforme o que foi marcado: com os dois, divide; com um só, ele leva tudo. */
    function regrasBebida(tem) {
        var nome = tem.refri && tem.suco ? "dois" : tem.refri ? "refri" : tem.suco ? "suco" : "";
        return nome ? REGRAS.bebida[nome + (tem.almoco ? "Alm" : "")] : { refri: {}, suco: {} };
    }

    function calcularCompras(g, tem) {
        var R = REGRAS, B = regrasBebida(tem);
        function soma(regra) { return (regra.adulto || 0) * g.adulto + (regra.grande || 0) * g.grande + (regra.pequena || 0) * g.pequena; }
        function folga(n) { return n ? Math.ceil(n * (1 + R.folgaReutilizavel)) : 0; }
        function reserva(n) { return Math.ceil(n * (1 + R.reservaDesc)); }
        var comem = g.adulto + g.grande + g.pequena;              // todo mundo menos bebê
        var bebem = tem.suco ? comem : tem.refri ? g.adulto + g.grande : 0;
        var cortam = g.adulto + g.grande;                         // faca: criança até 5 anos não usa
        var cadeiras = g.adulto + g.grande + g.pequena + g.bebe - g.colo;
        var refri = soma(B.refri), suco = soma(B.suco);
        var salgados = tem.salgados ? soma(tem.almoco ? R.salgadosAlm : R.salgados) : 0;
        var almoco = tem.almoco ? soma(R.almoco) : 0;
        var carne = tem.churrasco ? soma(R.carne) : 0, carneKg = Math.ceil(carne / 500) / 2, carvaoKg = Math.ceil(carneKg * R.carvaoPorKgCarne);
        var boloPessoas = tem.bolo ? comem : 0, bolo = boloPessoas * R.bolo;
        var doces = tem.doces ? soma(R.doces) : 0;
        var criancas = g.grande + g.pequena + g.bebe;
        var pratinhosPorPessoa = (tem.bolo ? 1 : 0) + (tem.salgados ? 1 : 0);
        var almocam = tem.almoco ? comem : 0, cortamAlm = tem.almoco ? cortam : 0;
        return {
            comem: comem, bebem: bebem, B: B, pratinhosPorPessoa: pratinhosPorPessoa,
            refriMl: refri, refriGarrafas: Math.ceil(refri / 2000),
            sucoMl: suco, sucoLitros: Math.ceil(suco / 1000),
            salgados: salgados, salgadosEncomenda: Math.ceil(salgados / 50) * 50,
            almocoG: almoco, almocoKg: Math.ceil(almoco / 500) / 2,
            carneG: carne, carneKg: carneKg, carvaoKg: carvaoKg, carvaoSacos: Math.ceil(carvaoKg / R.sacoCarvao),
            boloG: bolo, boloKg: bolo ? Math.max(1, Math.ceil(bolo / 500) / 2) : 0, fatias: boloPessoas,
            doces: doces, docesEncomenda: Math.ceil(doces / 25) * 25,
            lembrancinhas: tem.lembrancinhas ? Math.ceil((comem + g.bebe) * (1 + R.lembrancinhaReserva)) : 0,
            lembrancinhasCriancas: tem.lembrancinhas ? Math.ceil(criancas * (1 + R.lembrancinhaReserva)) : 0, criancas: criancas,
            cadeiras: cadeiras, mesas: Math.ceil(cadeiras / R.cadeirasPorMesa),
            geloKg: tem.refri || tem.suco ? comem * R.gelo : 0, geloSacos: tem.refri || tem.suco ? Math.ceil(comem * R.gelo / 5) : 0,
            papelToalha: comem ? Math.max(2, Math.ceil(comem / R.pessoasPorPapelToalha)) : 0,
            desc: {
                copos: bebem * (tem.almoco ? R.coposDescAlm : R.coposDesc),
                pratinhos: comem * pratinhosPorPessoa, garfinhos: reserva(boloPessoas),
                pratos: reserva(almocam), garfos: reserva(almocam), facas: reserva(cortamAlm),
                guardanapos: comem * (tem.almoco ? R.guardanaposAlm : R.guardanapos)
            },
            reut: {
                copos: folga(bebem),
                pratinhos: pratinhosPorPessoa ? folga(comem) : 0, garfinhos: folga(boloPessoas),   // garfinho ou colherzinha, 1 por pessoa
                pratos: folga(almocam), garfos: folga(almocam), facas: folga(cortamAlm)
            }
        };
    }

    function fmt(x) { return Number(x).toLocaleString("pt-BR"); }
    function litros(ml) { return fmt(Math.round(ml / 100) / 10) + " L"; }
    function pacotes(qtd, por) { if (!qtd) return "nenhum"; var p = Math.ceil(qtd / por); return p + (p === 1 ? " pacote" : " pacotes") + " de " + por; }
    function plural(x, um, varios) { return fmt(x) + " " + (x === 1 ? um : varios); }

    function pessoasCompras(ev, base) {
        base = base || baseCompras;
        return convidados(ev.id).filter(function (p) {
            if (!String(p.nome || "").trim()) return false;
            var s = situacao(p);
            return s === "vai" || (base === "todos" && s === "sem");
        });

    function comprasHTML(ev) {

    /* Link colado: o Google às vezes copia um link "imgres?imgurl=..." — tiro só a imagem de dentro */
    function linkDaImagem(v) {
        v = String(v || "").trim();

        if (/^https?:\/\/(www\.)?google\./.test(v) && m) { try { return decodeURIComponent(m[1]); } catch (e) {} }
        return v;
    }
    function dataParaBlob(d) {

        for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);

        if (!v || v === capaUltimoLink) return;   // o mesmo link não é buscado duas vezes (colar + sair do campo)
        capaUltimoLink = v;
        if (/^data:image\//.test(v)) { try { enviarCapa(ev, dataParaBlob(v)); } catch (e) {} return; }
        if (!/^https?:\/\//.test(v) || v.indexOf(location.origin + "/") === 0) return;
        var pv = document.getElementById("capa-previa");
        if (pv) pv.innerHTML = '<span class="nota-info">⏳ Trazendo a imagem para o site...</span>';
        fetch("/api/admin/capa-link?url=" + encodeURIComponent(v), { credentials: "same-origin" }).then(function (r) {
            if (!r.ok) return r.json().catch(function () { return {}; }).then(function (d) { throw new Error(d.erro || "Erro " + r.status); });
            return r.blob();
        }).then(function (b) {
            enviarCapa(ev, b);

    /* Foto da fototeca: reduz (lado maior 1600 px, JPEG) e envia para o site */
    function reduzirFoto(arquivo, max, q) {
        return new Promise(function (ok, falhou) {
            var url = URL.createObjectURL(arquivo), im = new Image();
            im.onload = function () {
                var w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / Math.max(w, h));
                var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
                c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
                var png = arquivo.type === "image/png";   // PNG sem fundo continua sem fundo
                c.toBlob(function (b) {
                    if (b && png && b.size > 4.5 * 1024 * 1024) {   // PNG grande demais: vira JPEG com fundo branco
                        var c2 = document.createElement("canvas"); c2.width = c.width; c2.height = c.height;

                        return c2.toBlob(function (b2) { b2 ? ok(b2) : falhou(new Error("blob")); }, "image/jpeg", q);
                    }
                    b ? ok(b) : falhou(new Error("blob"));

            };
