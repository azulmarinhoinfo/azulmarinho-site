        '</div>';
    }

    /* Convidados já salvos nos outros eventos (sem repetir nomes) */
    function chaveNome(n) { return String(n || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
    function contatos(ev) {
        var jaTem = {}, mapa = {};
        convidados(ev.id).forEach(function (p) { jaTem[chaveNome(p.nome)] = true; });
        var ordem = estado.eventos.slice().sort(function (a, b) { return (b.data || "").localeCompare(a.data || ""); });
        ordem.forEach(function (outro) {
            if (outro.id === ev.id) return;
            (estado.convidados[outro.id] || []).forEach(function (p) {
                var k = chaveNome(p.nome);
                if (!k || jaTem[k]) return;
                var c = mapa[k] || (mapa[k] = { nome: String(p.nome).trim(), whats: "", eventos: [] });
                if (!c.whats && p.whats) c.whats = String(p.whats).trim();   // o mais recente com WhatsApp
                ["tipo", "sexo", "idade"].forEach(function (x) { if (!c[x] && p[x]) c[x] = p[x]; });
                if (c.eventos.indexOf(outro.id) < 0) c.eventos.push(outro.id);
            });
        });
        return Object.keys(mapa).map(function (k) { return mapa[k]; }).sort(function (a, b) {
            return b.eventos.length - a.eventos.length || a.nome.localeCompare(b.nome, "pt-BR");
        });
    }
    function contatosHTML(ev, lista) {
        var cs = contatos(ev);
        if (!cs.length) return "";
        var comConv = estado.eventos.filter(function (o) { return o.id !== ev.id && (estado.convidados[o.id] || []).length; });
        return '<details class="varios-box"' + (lista.length ? "" : " open") + '><summary>Escolher dos convidados já salvos (' + cs.length + ')</summary>' +
            '<div class="contatos"><div class="filtros">' +
                '<input id="busca-contatos" placeholder="🔎 Buscar nome" autocomplete="off">' +
                '<select id="filtro-evento"><option value="">Todos os eventos</option>' + comConv.map(function (o) {
                    return '<option value="' + esc(o.id) + '">Quem foi em: ' + esc(o.titulo) + '</option>';
                }).join("") + '</select></div>' +
                '<ul class="lista-contatos" id="lista-contatos">' + cs.map(function (c, i) {
                    return '<li data-ev="' + esc(c.eventos.join(" ")) + '" data-k="' + esc(chaveNome(c.nome)) + '"><label>' +
                        '<input type="checkbox" data-contato="' + i + '"><span class="nm">' + esc(c.nome) + '</span>' +
                        '<small>' + (c.whats ? "📱 " + esc(c.whats) + " • " : "") + c.eventos.length + (c.eventos.length === 1 ? " evento" : " eventos") + '</small></label>' +
                        '<button class="esquecer" data-esquecer="' + i + '" title="Tirar de todos os eventos" aria-label="Tirar ' + esc(c.nome) + ' de todos os eventos">🗑</button></li>';
                }).join("") + '</ul>' +
                '<div class="acoes-c"><button class="b pequeno" data-acao="marcar-visiveis">Marcar todos da lista</button>' +
                '<button class="b pequeno" data-acao="desmarcar-contatos">Desmarcar</button>' +
                '<button class="b cheio" data-acao="add-contatos" id="add-contatos" disabled>Adicionar marcados</button></div>' +
            '</div></details>';
    }
    var CONTATOS_ABERTOS = [];

    function resumoConv(lista) {
        function conta(f) { return lista.filter(f).length; }
        function q(n, um, varios) { return n + " " + (n === 1 ? um : varios); }
        var partes = [q(lista.length, "na lista", "na lista"),
            q(conta(function (p) { return p.enviado; }), "convidado", "convidados"),
            q(conta(function (p) { return p.confirmado; }), "confirmado", "confirmados")];
        var nv = conta(function (p) { return p.naoVai; });
        if (nv) partes.push(q(nv, "não vai", "não vão"));
        var ng = conta(function (p) { return p.noGrupo && numero(p.whats); });
        if (ng) partes.push(ng + " no grupo do WhatsApp");
        var ad = conta(function (p) { return p.tipo === "adulto"; }), cr = conta(function (p) { return p.tipo === "crianca"; });
        var m = conta(function (p) { return p.sexo === "m"; }), f = conta(function (p) { return p.sexo === "f"; });
        if (ad || cr) partes.push(q(ad, "adulto", "adultos"), q(cr, "criança", "crianças"));
        if (m || f) partes.push(q(m, "homem", "homens") + " / " + q(f, "mulher", "mulheres"));
        return partes.join(" • ");
    }
    function atualizarResumo(ev) {
        var r = document.getElementById("resumo-conv");
        if (r) r.textContent = resumoConv(convidados(ev.id));
    }

    function convidadosHTML(ev) {
        var lista = convidados(ev.id);
        var enviados = lista.filter(function (p) { return p.enviado; }).length;
        lista.forEach(function (p) { if (!p.c) { p.c = novoCodigo(); p._codigoNovo = true; } });
        function opcao(i, campo, v, p, texto) {
            return '<button type="button" data-i="' + i + '" data-campo="' + campo + '" data-v="' + v + '"' +
                (p[campo] === v ? ' class="ativa" aria-pressed="true"' : ' aria-pressed="false"') + '>' + texto + '</button>';
        }
        var selec = ev.data && tarefaAntes(ev, { t: "Enviar o convite" });
        if (selec) return '<div class="seq-inicio parado"><span><b>👥 Primeiro: selecionar os convidados</b><small>Monte a lista de quem vai ser convidado (abaixo). ' +
                'Quando terminar, marque a tarefa <b>Selecionar os convidados</b> lá em cima: aí aparecem o <b>Enviar o convite</b> e o <b>Enviar em sequência</b>.</small></span></div>' +
            convidadosLista(ev, lista, enviados, opcao);
        var faltam = filaEnvio(ev).length, semWhats = lista.filter(function (p) { return !p.enviado && String(p.nome || "").trim() && !numero(p.whats); }).length;
        return (faltam
                ? '<div class="seq-inicio"><span><b>' + faltam + (faltam === 1 ? ' convidado ainda sem convite' : ' convidados ainda sem convite') + '</b>' +
                    '<small>Abre o WhatsApp de um por um, com o convite pronto. Você só toca em Enviar.' +
                    (semWhats ? ' (' + semWhats + (semWhats === 1 ? ' sem WhatsApp fica de fora.)' : ' sem WhatsApp ficam de fora.)') : '') + '</small></span>' +
                    '<button class="b verde" data-acao="sequencia">' + I.whats + 'Enviar em sequência</button></div>'
                : lista.length
                ? '<div class="seq-inicio parado"><span><b>Enviar em sequência</b><small>' +
                    (lista.some(function (p) { return numero(p.whats); })
                        ? 'Todos os convidados com WhatsApp já estão marcados como <b>Convidado</b>. Para mandar de novo, desmarque Convidado de quem quiser (ou use Desmarcar todos, lá embaixo).'
                        : 'Nenhum convidado tem WhatsApp cadastrado. Coloque o número com DDD ao lado do nome e salve.') +
                    '</small></span></div>'
                : "") +
            (function () {
                var nc = filaCobrar(ev).length;
                return nc ? '<div class="seq-inicio cobrar"><span><b>' + nc + (nc === 1 ? ' convidado recebeu o convite e ainda não respondeu' : ' convidados receberam o convite e ainda não responderam') + '</b>' +
                    '<small>Manda um pedido de confirmação (mensagem diferente do convite, explicando por que a resposta é importante), um por um.</small></span>' +
                    '<button class="b verde" data-acao="sequencia-cobrar">' + I.whats + 'Pedir confirmação</button></div>' : "";
            })() + convidadosLista(ev, lista, enviados, opcao);
    }
    function convidadosLista(ev, lista, enviados, opcao) {
        return '<div class="add-conv">' +
                '<input id="novo-nome" placeholder="Nome do convidado" autocomplete="off" list="sugestoes">' +
                '<input id="novo-whats" placeholder="WhatsApp com DDD (opcional)" inputmode="tel" autocomplete="off">' +
                '<button class="b cheio" data-acao="add-conv">Adicionar</button>' +
            '</div>' +
            (function () { var h = contatosHTML(ev, lista); CONTATOS_ABERTOS = contatos(ev); return h; })() +
            '<datalist id="sugestoes">' + contatos(ev).map(function (c) { return '<option value="' + esc(c.nome) + '">'; }).join("") + '</datalist>' +
            '<details class="varios-box"><summary>Adicionar vários de uma vez</summary>' +
                '<textarea class="varios" id="varios" placeholder="Um por linha. Exemplo:\nMaria Souza, 31 99999-8888\nJoão 31988887777\nTia Rosa"></textarea>' +
                '<button class="b" data-acao="add-varios">Adicionar todos</button></details>' +
            (lista.length
                ? '<ol class="linhas">' + lista.map(function (p, i) {
                    var n = numero(p.whats);
                    var botao = n
                        ? '<a class="convite' + (p.enviado ? " enviado" : "") + '" data-i="' + i + '" href="https://wa.me/' + n + '?text=' + encodeURIComponent(textoConvite(ev, p)) + '" target="_blank" rel="noopener">' +
                            I.whats + (p.enviado ? "✓ Enviado · Enviar de novo" : "Enviar convite") + '</a>'
                        : '<span class="convite inativo">sem WhatsApp</span>';
                    return '<li class="linha-conv"><span class="n">' + (i + 1) + '.</span>' +
                        '<input data-i="' + i + '" data-c="nome" value="' + esc(p.nome) + '" aria-label="Nome">' +
                        '<input data-i="' + i + '" data-c="whats" value="' + esc(p.whats || "") + '" placeholder="WhatsApp" inputmode="tel" aria-label="WhatsApp">' +
                        botao + '<button class="remover" data-remover="' + i + '" title="Remover" aria-label="Remover ' + esc(p.nome) + '">×</button>' +
                        '<div class="marcas">' +
                            '<label class="marca" title="O convite já foi enviado"><input type="checkbox" data-i="' + i + '" data-m="enviado"' + (p.enviado ? " checked" : "") + '>Convidado</label>' +
                            '<label class="marca conf" title="A pessoa confirmou presença"><input type="checkbox" data-i="' + i + '" data-m="confirmado"' + (p.confirmado ? " checked" : "") + '>Confirmado</label>' +
                            '<label class="marca nao" title="A pessoa avisou que não vai"><input type="checkbox" data-i="' + i + '" data-m="naoVai"' + (p.naoVai ? " checked" : "") + '>Não vai</label>' +
                            '<label class="marca grp' + (n ? '' : ' oculto') + '" title="Já coloquei a pessoa no grupo do WhatsApp do evento"><input type="checkbox" data-i="' + i + '" data-m="noGrupo"' + (p.noGrupo ? " checked" : "") + '>👥 Está no grupo</label>' +
                            '<span class="opcoes" role="group" aria-label="Adulto ou criança">' + opcao(i, "tipo", "adulto", p, "Adulto") + opcao(i, "tipo", "crianca", p, "Criança") + '</span>' +
                            '<span class="opcoes" role="group" aria-label="Sexo">' + opcao(i, "sexo", "m", p, "Masculino") + opcao(i, "sexo", "f", p, "Feminino") + '</span>' +
                            '<label class="idade' + (p.tipo === "crianca" ? " visivel" : "") + '">Idade <input data-i="' + i + '" data-c="idade" value="' + esc(p.idade || "") + '" type="number" min="0" max="17" inputmode="numeric" aria-label="Idade"> anos</label>' +
                            (p.respEm ? '<span class="pelo-link" title="Respondeu pelo link do convite em ' + esc(new Date(p.respEm).toLocaleString("pt-BR")) + '">📩 respondeu pelo link</span>' : "") +
                        '</div></li>';
                  }).join("") + '</ol>' +
                  '<div class="resumo-conv"><span id="resumo-conv">' + resumoConv(lista) + '</span>' +
                  '<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="b pequeno" data-acao="copiar">Copiar lista</button>' +
                  (enviados ? '<button class="b pequeno" data-acao="limpar-envios">Desmarcar todos</button>' : "") + '</span></div>'
                : '<p style="margin-top:18px;color:var(--texto-claro)">Nenhum convidado ainda.</p>');
    }

    /* ---------------- Enviar em sequência ----------------
       Abre o WhatsApp de um convidado por vez, com o convite pronto.
       Cada toque abre um convite, marca "Convidado", salva e já mostra o próximo. */

    var seq = null;   // { ev, fila: [índices], pos, pulados, ultimo }

    function filaEnvio(ev) {
        var fila = [];
        convidados(ev.id).forEach(function (p, i) {
            if (String(p.nome || "").trim() && !p.enviado && numero(p.whats)) fila.push(i);
        });
        return fila;
    }
    /* Quem já recebeu o convite, tem WhatsApp e ainda não respondeu (nem Vou, nem Não vou) */
    function filaCobrar(ev) {
        var fila = [];
        convidados(ev.id).forEach(function (p, i) {
            if (String(p.nome || "").trim() && p.enviado && !p.confirmado && !p.naoVai && numero(p.whats)) fila.push(i);
        });
        return fila;
    }
    /* Quem confirmou presença, tem WhatsApp e ainda não recebeu o agradecimento */
    function filaAgradecer(ev) {
        var fila = [];
        convidados(ev.id).forEach(function (p, i) {
            if (String(p.nome || "").trim() && p.confirmado && !p.agradecido && numero(p.whats)) fila.push(i);
        });
        return fila;
    }
    function linkConvite(ev, p) {
        var m = seq && seq.modo;
        return "https://wa.me/" + numero(p.whats) + "?text=" + encodeURIComponent(m === "cobrar" ? textoCobranca(ev, p) : m === "agradecer" ? textoAgradecer(ev, p) : textoConvite(ev, p));
    }

    function abrirSequencia(ev, modo) {
        convidados(ev.id).forEach(function (p) { if (!p.c) { p.c = novoCodigo(); p._codigoNovo = true; } });
        seq = { ev: ev, modo: modo || "convite", fila: modo === "cobrar" ? filaCobrar(ev) : modo === "agradecer" ? filaAgradecer(ev) : filaEnvio(ev), pos: 0, pulados: 0, ultimo: null };
        var d = document.getElementById("seq");
        if (!d) {
            d = document.createElement("div");
            d.id = "seq"; d.className = "seq";
            d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", "Enviar convites em sequência");
            document.body.appendChild(d);
            d.addEventListener("click", cliqueSequencia);
        }
        document.body.classList.add("seq-aberto");
        desenharSequencia();
    }

    function fecharSequencia() {
        var d = document.getElementById("seq");
        if (d) d.remove();
        document.body.classList.remove("seq-aberto");
        seq = null;
        desenhar();
    }

    function desenharSequencia() {
        var d = document.getElementById("seq");
        if (!d || !seq) return;
        var ev = seq.ev, lista = convidados(ev.id);
        var comWhats = lista.filter(function (p) { return String(p.nome || "").trim() && numero(p.whats); });
        var cob = seq.modo === "cobrar", agr = seq.modo === "agradecer";
        var feitos = comWhats.filter(function (p) { return p.enviado; }).length, total = comWhats.length;
        if (cob) { feitos = seq.pos - seq.pulados; total = seq.fila.length; }
        if (agr) { var cw = comWhats.filter(function (x) { return x.confirmado; }); feitos = cw.filter(function (x) { return x.agradecido; }).length; total = cw.length; }
        var p = seq.pos < seq.fila.length ? lista[seq.fila[seq.pos]] : null;
        var u = seq.ultimo != null ? lista[seq.ultimo] : null;
        var primeiro = function (x) { return esc(String(x.nome).trim().split(" ")[0]); };

        d.innerHTML = '<div class="seq-caixa">' +
            '<div class="seq-topo"><div><b>' + (agr ? "Agradecer em sequência" : cob ? "Pedir confirmação" : "Enviar em sequência") + '</b><small>' + esc(ev.titulo) + '</small></div>' +
                '<button class="b pequeno" data-seq="fechar">Fechar</button></div>' +
            '<div class="seq-prog"><i style="width:' + (total ? Math.round(feitos * 100 / total) : 0) + '%"></i></div>' +
            '<div class="seq-conta"><span><b>' + feitos + ' de ' + total + '</b> ' + (agr ? "já agradecidos" : cob ? "pedidos abertos" : "já convidados") + '</span><span>' +
                (p ? (seq.fila.length - seq.pos) + (seq.fila.length - seq.pos === 1 ? " falta" : " faltam") : "") + '</span></div>' +
            (p
                ? '<div class="seq-pessoa"><small>' + (agr ? "Próximo agradecimento" : cob ? "Ainda não respondeu" : "Próximo convite") + '</small><strong>' + esc(p.nome) + '</strong><span>' + esc(p.whats) + '</span></div>' +
                  '<a class="seq-enviar" data-seq="enviar" href="' + linkConvite(ev, p) + '" target="whats-convite">' + I.whats + (agr ? 'Agradecer ' : cob ? 'Pedir confirmação de ' : 'Abrir convite de ') + primeiro(p) + '</a>' +
                  '<div class="seq-acoes"><button class="b pequeno" data-seq="pular">Pular ' + primeiro(p) + '</button></div>'
                : '<div class="seq-fim"><span class="e">🎉</span><strong>Fila concluída!</strong>' +
                  (seq.pulados ? '<p>' + seq.pulados + (seq.pulados === 1 ? ' pessoa foi pulada e continua' : ' pessoas foram puladas e continuam') + (agr ? ' sem o agradecimento.' : cob ? ' sem o pedido.' : ' sem convite.') + '</p>' : '<p>' + (agr ? 'Todos os agradecimentos foram abertos. Obrigado pela festa! 💙' : cob ? 'Todos os pedidos de confirmação foram abertos. As respostas entram sozinhas pelo link.' : 'Todos os convites desta lista foram abertos.') + '</p>') +
                  '</div><div class="seq-acoes"><button class="b cheio" data-seq="fechar">Voltar para a lista</button></div>') +
            (u
                ? '<div class="seq-ultimo">✓ <b>' + esc(u.nome) + '</b> ' + (agr ? "recebeu o agradecimento. " : cob ? "recebeu o pedido de confirmação. " : "marcado(a) como convidado(a). ") +
                  '<a href="' + linkConvite(ev, u) + '" target="whats-convite">Abrir de novo</a> · ' +
                  '<button data-seq="desfazer">Não consegui enviar</button></div>'
                : "") +
            '<p class="seq-dica">No WhatsApp, toque em <b>Enviar</b> e volte para esta tela. Para evitar bloqueio do WhatsApp, vá com calma: de preferência em blocos de 20 a 30 mensagens, com uma pausa entre eles. Pode fechar e continuar depois, que a fila começa de onde parou.</p>' +
        '</div>';
    }

    function cliqueSequencia(e) {
        if (!seq) return;
        if (e.target === e.currentTarget) return fecharSequencia();
        var alvo = e.target.closest("[data-seq]");
        if (!alvo) return;
        var acao = alvo.getAttribute("data-seq"), lista = convidados(seq.ev.id);

        if (acao === "fechar") return fecharSequencia();
        if (acao === "enviar") {
            /* O link abre o WhatsApp normalmente; aqui só marca e avança */
            var i = seq.fila[seq.pos], p = lista[i];
            if (seq.modo === "agradecer") {
                p.agradecido = agora().dia;
                seq.ultimo = i; seq.pos++;
                salvar("Agradecimento de " + String(p.nome).trim().split(" ")[0] + " aberto ✓");
                setTimeout(desenharSequencia, 0);
                return;
            }
            if (seq.modo === "cobrar") {
                p.cobrado = agora().dia;
                seq.ultimo = i; seq.pos++;
                salvar("Pedido de confirmação de " + String(p.nome).trim().split(" ")[0] + " aberto ✓");
                setTimeout(desenharSequencia, 0);
                return;
            }
            p.enviado = true;
            delete p._codigoNovo;
            seq.ultimo = i;
            seq.pos++;
            salvar("Convite de " + String(p.nome).trim().split(" ")[0] + " marcado como enviado ✓");
            setTimeout(desenharSequencia, 0);
            return;
        }
        if (acao === "pular") {
            seq.pos++; seq.pulados++;
            seq.ultimo = null;
            return desenharSequencia();
        }
        if (acao === "desfazer" && seq.ultimo != null) {
            var pu = lista[seq.ultimo];
            if (seq.modo === "agradecer") {
                delete pu.agradecido;
                seq.pos--; seq.fila[seq.pos] = seq.ultimo; seq.ultimo = null;
                salvar("Agradecimento desmarcado");
                return desenharSequencia();
            }
            if (seq.modo === "cobrar") {
                delete pu.cobrado;
                seq.pos--; seq.fila[seq.pos] = seq.ultimo; seq.ultimo = null;
                salvar("Pedido de confirmação desmarcado");
                return desenharSequencia();
            }
            delete pu.enviado; delete pu.confirmado; delete pu.naoVai;
            seq.pos--;
            seq.fila[seq.pos] = seq.ultimo;
            seq.ultimo = null;
            salvar("Marca de convidado retirada");
            return desenharSequencia();
        }
    }

    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && seq) fecharSequencia();
    });

    function amostra() {
        if (atual && evento(atual)) atualizarNomeAlbum(evento(atual));
        var a = document.getElementById("amostra");
        if (!a) return;
        var t = EV.tema(evento(atual));
        a.style.background = "linear-gradient(135deg," + t.fundo1 + "," + t.fundo2 + ")";
        a.style.color = t.texto;
        a.innerHTML = '<span class="e">' + t.emoji + '</span><div><b style="color:' + t.titulo + '">' + esc(evento(atual).titulo || "Título do evento") + '</b>' +
            'Assim fica a página do evento.<br><span class="btn-a" style="background:' + t.destaque + ';color:' + (t.claro ? "#fff" : t.fundo1) + '">Botão</span></div>';
    }

    /* ---------------- Interação ---------------- */

    function ligarEditor() { amostra(); }

    function atualizarLista() {
        var itens = painel.querySelector(".itens");
        if (itens) itens.innerHTML = listaHTML();
    }

    function filtrarContatos() {
        var busca = chaveNome((document.getElementById("busca-contatos") || {}).value);
        var filtro = (document.getElementById("filtro-evento") || {}).value || "";
        painel.querySelectorAll("#lista-contatos li").forEach(function (li) {
            var ok = (!busca || li.getAttribute("data-k").indexOf(busca) >= 0) &&
                (!filtro || (" " + li.getAttribute("data-ev") + " ").indexOf(" " + filtro + " ") >= 0);
            li.style.display = ok ? "" : "none";
        });
    }
    function contarMarcados() {
        var n = painel.querySelectorAll("[data-contato]:checked").length, b = document.getElementById("add-contatos");

    function trocarId(ev, id) {
        if (ev.id === id) return;
        if (estado.tarefas[ev.id]) {
            estado.tarefas[id] = estado.tarefas[ev.id];
            delete estado.tarefas[ev.id];

        if (estado.convidados[ev.id]) {
            estado.convidados[id] = estado.convidados[ev.id];
            delete estado.convidados[ev.id];
        }
        if (estado.fornecedores[ev.id]) {
            estado.fornecedores[id] = estado.fornecedores[ev.id];
            delete estado.fornecedores[ev.id];
        }
        ev.id = id;
        atual = id;
    }

    function abrir(id) {
        atual = id;
        /* Descrição com a frase antiga ("bolo, salgadinhos...") passa a seguir o que está marcado em Compras */
        var evA = id && evento(id);
        if (evA && descricaoSegueItens(evA)) marcarSujo();
        /* Abrir um evento entra no histórico: o "voltar" do celular volta para a lista de eventos */
        if (id && !location.hash) history.pushState(null, "", "#" + encodeURIComponent(id));
        else history.replaceState(null, "", id ? "#" + encodeURIComponent(id) : location.pathname);
        desenhar();
        window.scrollTo(0, 0);
    }
    window.addEventListener("popstate", function () {

        window.scrollTo(0, 0);
    });

                copiarTexto(nomeAlbumSugerido(ev)).then(function () {
                    alvo.textContent = "Copiado! ✓";
                    setTimeout(function () { alvo.textContent = rotA; }, 1800);
                });
                break;

            case "aviso-cel-abrir":
                avisoCelAberto = !avisoCelAberto;
                avisoCelSt = "";
                redesenharTarefas();
                break;
            case "aviso-cel-copiar":
                copiarTexto(AVISO_CEL.topico).then(function () {
                    alvo.textContent = "Copiado! ✓";
                    setTimeout(function () { alvo.textContent = "📋 Copiar"; }, 1800);
                });
                break;
            case "aviso-cel-teste":
                avisoCelTeste();
                break;

            case "convite-auto":
                ev.conviteTexto = "";
                marcarSujo();
                atualizarPrevias(ev);
                painel.querySelectorAll('[data-c="conviteTexto"]').forEach(function (el) { el.value = modeloConvite(ev); });
                painel.querySelectorAll(".editar-convite summary small").forEach(function (el) { el.remove(); });
                break;
            case "copiar-texto":
                var txtC = COPIAS[alvo.getAttribute("data-k")], rot = alvo.getAttribute("data-rot") || "📋 Copiar";
                if (txtC == null) break;
                copiarTexto(txtC).then(function () {
                    alvo.textContent = "Copiado! ✓";
                    setTimeout(function () { alvo.textContent = rot; }, 1800);
                });
                break;

            case "ir-aba":
                aba = alvo.getAttribute("data-v");
                desenhar();
                window.scrollTo(0, 0);
                if (window.innerWidth < 900) document.getElementById("editor").scrollIntoView();
                break;

            case "tema-aplicar":
                aplicarTemaDaTarefa(ev, (document.getElementById("tema-nome") || {}).value || "");
                break;

            case "fornecedor-add":
                var nfNome = document.getElementById("nf-nome");
                if (!nfNome.value.trim()) { nfNome.focus(); break; }
                var nfNovo = { tipo: document.getElementById("nf-tipo").value, nome: nfNome.value.trim(), whats: document.getElementById("nf-whats").value.trim() };
                fornecedores(ev.id).push(nfNovo);
                guardarNaAgenda(nfNovo);
                marcarSujo(); desenhar();
                var nn = document.getElementById("nf-nome"); if (nn) nn.focus();
                break;

            case "fornecedor-reusar":
                var fr = FORN_OUTROS[+alvo.getAttribute("data-k")];
                if (!fr) break;
                fornecedores(ev.id).push({ tipo: fr.tipo, nome: fr.nome, whats: fr.whats || "" });
                marcarSujo(); var yr = window.scrollY; desenhar(); window.scrollTo(0, yr);
                break;

            case "agenda-esquecer":
                var fe = FORN_OUTROS[+alvo.getAttribute("data-k")];
                if (!fe || !confirm("Tirar " + fe.nome + " da agenda de fornecedores?\n\nQuem já está em algum evento continua lá.")) break;
                estado.agenda = estado.agenda.filter(function (a) { return a !== fe; });
                marcarSujo(); var ye = window.scrollY; desenhar(); window.scrollTo(0, ye);
                break;

            case "fornecedor-remover":
                var lf = fornecedores(ev.id), ir = +alvo.getAttribute("data-i");
                if (lf[ir] && confirm("Remover " + (lf[ir].nome || "este fornecedor") + "?")) { lf.splice(ir, 1); marcarSujo(); desenhar(); }
                break;

            case "add-conv":
                var n = document.getElementById("novo-nome"), w = document.getElementById("novo-whats");
                if (adicionar(n.value, w.value)) { marcarSujo(); desenhar(); document.getElementById("novo-nome").focus(); }
                else n.focus();
                break;

            case "marcar-visiveis":
            case "desmarcar-contatos":
                var marcar = alvo.getAttribute("data-acao") === "marcar-visiveis";
                painel.querySelectorAll("#lista-contatos li").forEach(function (li) {
                    if (li.style.display !== "none" || !marcar) li.querySelector("input").checked = marcar;
                });
                contarMarcados();
                break;

            case "add-contatos":
                var qtdC = 0;
                painel.querySelectorAll("[data-contato]:checked").forEach(function (cb) {
                    var c = CONTATOS_ABERTOS[+cb.getAttribute("data-contato")];
                    if (c && adicionar(c.nome, c.whats, c)) qtdC++;
                });
                if (qtdC) { marcarSujo(); desenhar(); mostrarBarra(qtdC + (qtdC === 1 ? " convidado adicionado" : " convidados adicionados") + ". Clique em Salvar.", false); }
                break;

            case "add-varios":
                var linhas = document.getElementById("varios").value.split(/\n+/), qtd = 0;
                linhas.forEach(function (l) {
                    var m = l.match(/^(.*?)[\s,;:-]*((?:\+?\(?\d[\d\s().-]{7,}\d))?\s*$/);
                    if (m && adicionar(m[1].replace(/[\s,;:-]+$/, ""), m[2] || "")) qtd++;
                });
                if (qtd) { marcarSujo(); desenhar(); }
                break;

            case "copiar":
                var texto = ev.titulo + " (" + EV.dataCurta(ev) + ")\n" + convidados(ev.id).map(function (p, i) {
                    return (i + 1) + ". " + p.nome + (p.tipo === "crianca" ? " (criança" + (p.idade ? ", " + p.idade + (+p.idade === 1 ? " ano" : " anos") : "") + ")" : "") + (p.confirmado ? " ✅" : p.naoVai ? " ❌" : "");
                }).join("\n");
                navigator.clipboard.writeText(texto).then(function () {
                    alvo.textContent = "Copiado!";
                    setTimeout(function () { alvo.textContent = "Copiar lista"; }, 1800);
                });
                break;

            case "tarefas-filtro":
                filtroTarefas = alvo.getAttribute("data-f");
                vistaTarefas = "lista";
                ultimaConcluida = null;
                redesenharTarefas();
                break;

            case "tarefa-desfazer":
                var td = tarefa(ev, alvo.getAttribute("data-id"));
                if (td) { delete td.feito; marcarSujo(); }
                ultimaConcluida = null;
                redesenharTarefas();
                break;

            case "tarefas-vista":
                vistaTarefas = alvo.getAttribute("data-v");
                redesenharTarefas();
                break;

            case "tarefa-add":
                var nt = document.getElementById("nt-titulo"), ntDia = document.getElementById("nt-dia").value;
                if (!nt.value.trim()) { nt.focus(); break; }
                if (!/^\d{4}-\d{2}-\d{2}$/.test(ntDia)) { document.getElementById("nt-dia").focus(); break; }
                var nova = { id: "t" + novoCodigo().slice(0, 8), t: nt.value.trim(), g: document.getElementById("nt-g").value, dia: ntDia,
                    ini: document.getElementById("nt-ini").value, fim: document.getElementById("nt-fim").value };
                cronograma(ev).itens.push(nova);
                cronograma(ev).itens.sort(ordemTarefa);
                marcarSujo();
                focarTarefa = nova.id;
                redesenharTarefas();
                break;

            case "tarefa-padrao": {
                /* Leva só esta tarefa para o padrão (nome, grupo, dia e horário), sem mexer nas outras */
                var tp = tarefa(ev, alvo.getAttribute("data-id"));
                if (!tp || !String(tp.t || "").trim()) break;
                var ip = indicePadrao(ev, tp), sp = situacaoPadrao(ev, tp);
                if (sp === "igual") { mostrarBarra("\"" + tp.t + "\" já está assim no padrão.", false); break; }
                var pdN = padraoAtual(ev).map(function (x) { return x.slice(); });
                var nova = linhaPadrao(ev, tp, ip >= 0 ? pdN[ip] : null);
                if (ip >= 0) pdN[ip] = nova; else pdN.push(nova);
                guardarPadrao(ev, pdN);
                tp.p = nova[1];
                var dN = nova[2];
                marcarSujo(); redesenharTarefas();
                mostrarBarra((ip >= 0 ? "Atualizei no padrão: " : "Coloquei no padrão: ") + "\"" + nova[1] + "\" (" +
                    (dN === 0 ? "no dia da festa" : dN < 0 ? (dN === -1 ? "na véspera" : -dN + " dias antes") : (dN === 1 ? "1 dia depois" : dN + " dias depois")) +
                    (tp.ini ? ", " + tp.ini + (tp.fim ? " às " + tp.fim : "") : "") + ")" + (ehSabado(ev) ? " no padrão do SÁBADO. Os próximos eventos de sábado" : ". Os próximos eventos") + " já vêm assim. Clique em Salvar.", false);
                break;
            }
            case "tarefa-remover":
                var tr = tarefa(ev, alvo.getAttribute("data-id"));
                if (tr && tr.pis) { mostrarBarra("Essa tarefa vem da agenda da Piscina. Para mudar, mude na página da Piscina.", false); break; }
                if (tr && confirm("Apagar a tarefa \"" + tr.t + "\"?")) {
                    cronograma(ev).itens = cronograma(ev).itens.filter(function (t) { return t !== tr; });
                    marcarSujo(); redesenharTarefas();
                }
                break;

            case "ir-tarefa":
                vistaTarefas = "lista";
                focarTarefa = alvo.getAttribute("data-id");
                redesenharTarefas();
                break;

            case "tarefas-mover":
                cronograma(ev);
                moverTarefasComAData(ev);
                redesenharTarefas();
                break;

            case "tarefas-manter":
                cronograma(ev).base = ev.data;
                marcarSujo(); redesenharTarefas();
                break;

            case "tarefas-guardar-padrao":
                if (!confirm("Usar as tarefas deste evento como padrão para os próximos eventos " + (ehSabado(ev) ? "de SÁBADO" : "de DOMINGO") + "?\n\nOs dias ficam contados a partir da data da festa (ex.: 3 dias antes). Os eventos que já têm cronograma não mudam.\n\nIsso só vale depois de Salvar.")) break;
                guardarPadrao(ev, cronograma(ev).itens.filter(function (t) { return !t.pis; }).sort(ordemTarefa).map(function (t) {
                    return [t.g || "Outras", t.t, difDias(t.dia, ev.data), t.ini || "", t.fim || ""];
                }));
                marcarSujo(); redesenharTarefas();
                mostrarBarra("Pronto: esta lista vai ser o padrão dos próximos eventos " + (ehSabado(ev) ? "de sábado" : "de domingo") + ". Clique em Salvar.", false);
                break;

            case "tarefas-padrao-original":
                if (!confirm("Voltar a usar o padrão sugerido para os próximos eventos " + (ehSabado(ev) ? "de SÁBADO" : "de DOMINGO") + "?\n\nIsso só vale depois de Salvar.")) break;
                guardarPadrao(ev, null);
                marcarSujo(); redesenharTarefas();
                break;

            case "tarefas-completar": {
                /* Acrescenta só as tarefas do padrão que este evento ainda não tem (pelo nome), sem mexer nas outras */
                var cr = cronograma(ev), tem = {};
                cr.itens.forEach(function (t) { tem[chaveNome(t.t)] = true; if (t.p) tem[chaveNome(t.p)] = true; });
                var novas = montarTarefas(ev).filter(function (t) { return !tem[chaveNome(t.t)]; });
                if (!novas.length) { mostrarBarra("Este evento já tem todas as tarefas do padrão.", false); break; }
                cr.itens = cr.itens.concat(novas).sort(ordemTarefa);
                marcarSujo(); redesenharTarefas();
                mostrarBarra(novas.length === 1 ? "Acrescentei 1 tarefa do padrão. Clique em Salvar." : "Acrescentei " + novas.length + " tarefas do padrão. Clique em Salvar.", false);
                break;
            }
            case "tarefas-recomecar":
                if (!confirm("Trocar as tarefas deste evento pelas do padrão?\n\nAs tarefas que você criou ou mudou aqui (e as marcas de feita) serão perdidas.\n\nIsso só vale depois de Salvar.")) break;
                estado.tarefas[ev.id] = { base: ev.data, itens: montarTarefas(ev) };
                calRef = null;
                marcarSujo(); redesenharTarefas();
                break;

            case "cal-modo":
                calModo = alvo.getAttribute("data-v");
                redesenharTarefas();
                break;

            case "cal-nav":
                var v = alvo.getAttribute("data-v");
                if (v === "hoje") calRef = agora().dia;
                else if (v === "festa") calRef = ev.data;
                else if (calModo === "mes") { var r = deISO(calRef); calRef = diaISO(new Date(r.getFullYear(), r.getMonth() + +v, 1)); }
                else calRef = somarDias(calRef, 7 * v);
                redesenharTarefas();
                break;

            case "cal-dia":
                calRef = alvo.getAttribute("data-v"); calModo = "semana";
                redesenharTarefas();
                break;

            case "copiar-tarefas":
                navigator.clipboard.writeText(textoTarefas(ev)).then(function () {
                    alvo.textContent = "Copiado!";
                    setTimeout(function () { alvo.textContent = "📋 Copiar pendentes"; }, 1800);
                });
                break;

            case "copiar-compras":
                navigator.clipboard.writeText(textoCompras(ev)).then(function () {
                    alvo.textContent = "Copiado!";
                    setTimeout(function () { alvo.textContent = "📋 Copiar lista de compras"; }, 1800);
                });
                break;

            case "limpar-envios":
                if (!confirm("Tirar as marcas de Convidado, Confirmado e Não vai de todos desta lista?\n\nIsso só vale depois de Salvar.")) return;
                convidados(ev.id).forEach(function (p) { delete p.enviado; delete p.confirmado; delete p.naoVai; });
                marcarSujo(); desenhar();
                break;
        }
    });

    /* Mudou o dia ou o horário de uma tarefa: reorganiza a lista quando o cursor sai do campo */
    painel.addEventListener("focusout", function (e) {
        if (tarefaMudou && e.target.hasAttribute && e.target.hasAttribute("data-tf")) { tarefaMudou = false; redesenharDepois(); }
    });

    painel.addEventListener("toggle", function (e) {
        var f = e.target.getAttribute && e.target.getAttribute("data-faixa");
        if (f) faixaEstado[f] = e.target.open;
    }, true);

    painel.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && e.target.id === "tema-nome") {
            e.preventDefault();
            painel.querySelector('[data-acao="tema-aplicar"]').click();
        }
        if (e.key === "Enter" && (e.target.id === "nf-nome" || e.target.id === "nf-whats")) {
            e.preventDefault();
            painel.querySelector('[data-acao="fornecedor-add"]').click();
        }
        if (e.key === "Enter" && e.target.id === "nt-titulo") {
            e.preventDefault();
            painel.querySelector('[data-acao="tarefa-add"]').click();
        }
        if (e.key === "Enter" && (e.target.id === "novo-nome" || e.target.id === "novo-whats")) {
            e.preventDefault();
            painel.querySelector('[data-acao="add-conv"]').click();
        }
    });

    /* ---------------- Salvar ---------------- */

    var salvando = false, salvarDeNovo = null;
    function salvar(silencioso) {
        /* Se já está salvando (ex.: convites em sequência), salva de novo logo depois */
        if (salvando) { if (silencioso) salvarDeNovo = silencioso; return; }
        var erro = "";
        estado.eventos.forEach(function (ev) {
            if (!erro && !String(ev.titulo || "").trim()) erro = "Falta o título de um evento.";
            if (!erro && !/^\d{4}-\d{2}-\d{2}$/.test(ev.data || "")) erro = "Falta a data do evento \"" + ev.titulo + "\".";
        });
        if (erro) { mostrarBarra(erro, true); return; }

        /* Tira convidados de eventos que não existem mais e linhas sem nome */
        var conv = {};
        estado.eventos.forEach(function (ev) {
            var l = (estado.convidados[ev.id] || []).filter(function (p) { return String(p.nome || "").trim(); })
                .map(function (p) { var o = { nome: String(p.nome).trim() }; if (p.whats) o.whats = String(p.whats).trim(); if (p.enviado) o.enviado = true;
                    if (p.confirmado) o.confirmado = true;
                    if (p.naoVai) o.naoVai = true;
                    if (p.noGrupo) o.noGrupo = true;
                    if (/^[a-z0-9]{8,20}$/.test(p.c || "")) o.c = p.c;
                    if (p.respEm) o.respEm = p.respEm;
                    if (/^\d{4}-\d{2}-\d{2}$/.test(p.cobrado || "")) o.cobrado = p.cobrado;
                    if (/^\d{4}-\d{2}-\d{2}$/.test(p.agradecido || "")) o.agradecido = p.agradecido;
                    if (/^\d{4}-\d{2}-\d{2}$/.test(p.lembrado || "")) o.lembrado = p.lembrado;
                    if (p.tipo === "adulto" || p.tipo === "crianca") o.tipo = p.tipo;
                    if (p.sexo === "m" || p.sexo === "f") o.sexo = p.sexo;
                    var id = parseInt(p.idade, 10);
                    if (o.tipo === "crianca" && id >= 0 && id < 18) o.idade = id;
                    return o; });
            if (l.length) conv[ev.id] = l;
        });
        var eventos = estado.eventos.map(function (ev) { var o = copia(ev); delete o._novo; delete o._ini; return limpo(o); });
        var tarefas = {};
        estado.eventos.forEach(function (ev) {
            var c = estado.tarefas[ev.id];
            if (!c) return;
            tarefas[ev.id] = { base: c.base || ev.data, itens: c.itens.filter(function (t) { return String(t.t || "").trim() && /^\d{4}-\d{2}-\d{2}$/.test(t.dia || ""); })
                .map(function (t) { var o = { id: t.id, t: String(t.t).trim(), g: t.g || "Outras", dia: t.dia, ini: t.ini || "", fim: t.fim || "" }; if (t.feito) o.feito = true; if (t.p) o.p = String(t.p); if (t.pis) o.pis = String(t.pis); return o; }) };
            if (c.tem && typeof c.tem === "object") tarefas[ev.id].tem = c.tem;
        });

        var forn = {};
        estado.eventos.forEach(function (ev) {
            var l = (estado.fornecedores[ev.id] || []).filter(function (f) { return String(f.nome || "").trim(); }).map(function (f) {
                var o = { tipo: String(f.tipo || "Outros"), nome: String(f.nome).trim() };
                ["whats", "obs", "valor"].forEach(function (x) { if (String(f[x] || "").trim()) o[x] = String(f[x]).trim(); });
                if (f.pago) o.pago = true;
                return o;
            });
            if (l.length) forn[ev.id] = l;
        });
        var agenda = estado.agenda.filter(function (f) { return String(f.nome || "").trim(); }).map(function (f) {
            var o = { tipo: String(f.tipo || "Outros"), nome: String(f.nome).trim() };
            if (String(f.whats || "").trim()) o.whats = String(f.whats).trim();
            return o;
        });

        salvando = true;
        var botao = document.getElementById("salvar");
        botao.disabled = true;
        mostrarBarra("Salvando...", false);

        fetch("/api/admin/dados", {
            method: "PUT", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ eventos: eventos, convidados: conv, tarefas: tarefas, tarefasPadrao: estado.tarefasPadrao, tarefasPadraoSabado: estado.tarefasPadraoSabado, fornecedores: forn, agendaFornecedores: agenda, versao: estado.versao })
        })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); })
        .then(function (d) {
            if (d._status !== 200) throw new Error(d.erro || "Erro " + d._status);
            estado.versao = d.versao;
            estado.eventos.forEach(function (ev) { delete ev._novo; delete ev._ini; });
            sujo = false;
            mostrarBarra(typeof silencioso === "string" ? silencioso : silencioso ? "Convite marcado como enviado ✓" : "Tudo salvo ✓ O site atualiza em até 1 minuto.", false);
            setTimeout(function () { if (!sujo) document.getElementById("barra").classList.remove("visivel"); }, 4000);
        })
        .catch(function (err) {
            mostrarBarra("Não salvou: " + err.message, true);
        })
        .then(function () {
            salvando = false; botao.disabled = false;
            if (salvarDeNovo) { var s = salvarDeNovo; salvarDeNovo = null; salvar(s); }
        });
    }

    document.getElementById("salvar").addEventListener("click", function () { salvar(false); });

    window.addEventListener("beforeunload", function (e) {
        if (sujo) { e.preventDefault(); e.returnValue = ""; }
    });
})();
</script>
