                        botao + '<button class="remover" data-remover="' + i + '" title="Remover" aria-label="Remover ' + esc(p.nome) + '">×</button>' +
                        '<div class="marcas">' +
                            '<label class="marca" title="O convite já foi enviado"><input type="checkbox" data-i="' + i + '" data-m="enviado"' + (p.enviado ? " checked" : "") + '>Convidado</label>' +
                            '<label class="marca conf" title="A pessoa confirmou presença"><input type="checkbox" data-i="' + i + '" data-m="confirmado"' + (p.confirmado ? " checked" : "") + '>Confirmado</label>' +
                            '<label class="marca nao" title="A pessoa avisou que não vai"><input type="checkbox" data-i="' + i + '" data-m="naoVai"' + (p.naoVai ? " checked" : "") + '>Não vai</label>' +
                            '<span class="opcoes" role="group" aria-label="Adulto ou criança">' + opcao(i, "tipo", "adulto", p, "Adulto") + opcao(i, "tipo", "crianca", p, "Criança") + '</span>' +
                            '<span class="opcoes" role="group" aria-label="Sexo">' + opcao(i, "sexo", "m", p, "Masculino") + opcao(i, "sexo", "f", p, "Feminino") + '</span>' +
                            '<label class="idade' + (p.tipo === "crianca" ? " visivel" : "") + '">Idade <input data-i="' + i + '" data-c="idade" value="' + esc(p.idade || "") + '" type="number" min="0" max="17" inputmode="numeric" aria-label="Idade"> anos</label>' +
                            (p.respEm ? '<span class="pelo-link" title="Respondeu pelo link do convite em ' + esc(new Date(p.respEm).toLocaleString("pt-BR")) + '">📩 respondeu pelo link</span>' : "") +
                        '</div></li>';
                  }).join("") + '</ol>' +
                  '<div class="resumo-conv"><span id="resumo-conv">' + resumoConv(lista) + '</span>' +
                  '<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="b pequeno" data-acao="copiar">Copiar lista</button>' +
                  (enviados ? '<button class="b pequeno" data-acao="limpar-envios">Desmarcar todos</button>' : "") + '</span></div>'
                : '<p style="margin-top:18px;color:var(--texto-claro)">Nenhum convidado ainda.</p>');
    }

    /* ---------------- Enviar em sequência ----------------
       Abre o WhatsApp de um convidado por vez, com o convite pronto.
       Cada toque abre um convite, marca "Convidado", salva e já mostra o próximo. */

    var seq = null;   // { ev, fila: [índices], pos, pulados, ultimo }

    function filaEnvio(ev) {
        var fila = [];
        convidados(ev.id).forEach(function (p, i) {
            if (String(p.nome || "").trim() && !p.enviado && numero(p.whats)) fila.push(i);
        });
        return fila;
    }
    function linkConvite(ev, p) {
        return "https://wa.me/" + numero(p.whats) + "?text=" + encodeURIComponent(textoConvite(ev, p));
    }

    function abrirSequencia(ev) {
        convidados(ev.id).forEach(function (p) { if (!p.c) { p.c = novoCodigo(); p._codigoNovo = true; } });
        seq = { ev: ev, fila: filaEnvio(ev), pos: 0, pulados: 0, ultimo: null };
        var d = document.getElementById("seq");
        if (!d) {
            d = document.createElement("div");
            d.id = "seq"; d.className = "seq";
            d.setAttribute("role", "dialog"); d.setAttribute("aria-modal", "true"); d.setAttribute("aria-label", "Enviar convites em sequência");
            document.body.appendChild(d);
            d.addEventListener("click", cliqueSequencia);
        }
        document.body.classList.add("seq-aberto");
        desenharSequencia();
    }

    function fecharSequencia() {
        var d = document.getElementById("seq");
        if (d) d.remove();
        document.body.classList.remove("seq-aberto");
        seq = null;
        desenhar();
    }

    function desenharSequencia() {
        var d = document.getElementById("seq");
        if (!d || !seq) return;
        var ev = seq.ev, lista = convidados(ev.id);
        var comWhats = lista.filter(function (p) { return String(p.nome || "").trim() && numero(p.whats); });
        var feitos = comWhats.filter(function (p) { return p.enviado; }).length, total = comWhats.length;
        var p = seq.pos < seq.fila.length ? lista[seq.fila[seq.pos]] : null;
        var u = seq.ultimo != null ? lista[seq.ultimo] : null;
        var primeiro = function (x) { return esc(String(x.nome).trim().split(" ")[0]); };

        d.innerHTML = '<div class="seq-caixa">' +
            '<div class="seq-topo"><div><b>Enviar em sequência</b><small>' + esc(ev.titulo) + '</small></div>' +
                '<button class="b pequeno" data-seq="fechar">Fechar</button></div>' +
            '<div class="seq-prog"><i style="width:' + (total ? Math.round(feitos * 100 / total) : 0) + '%"></i></div>' +
            '<div class="seq-conta"><span><b>' + feitos + ' de ' + total + '</b> já convidados</span><span>' +
                (p ? (seq.fila.length - seq.pos) + (seq.fila.length - seq.pos === 1 ? " falta" : " faltam") : "") + '</span></div>' +
            (p
                ? '<div class="seq-pessoa"><small>Próximo convite</small><strong>' + esc(p.nome) + '</strong><span>' + esc(p.whats) + '</span></div>' +
                  '<a class="seq-enviar" data-seq="enviar" href="' + linkConvite(ev, p) + '" target="whats-convite">' + I.whats + 'Abrir convite de ' + primeiro(p) + '</a>' +
                  '<div class="seq-acoes"><button class="b pequeno" data-seq="pular">Pular ' + primeiro(p) + '</button></div>'
                : '<div class="seq-fim"><span class="e">🎉</span><strong>Fila concluída!</strong>' +
                  (seq.pulados ? '<p>' + seq.pulados + (seq.pulados === 1 ? ' pessoa foi pulada e continua' : ' pessoas foram puladas e continuam') + ' sem convite.</p>' : '<p>Todos os convites desta lista foram abertos.</p>') +
                  '</div><div class="seq-acoes"><button class="b cheio" data-seq="fechar">Voltar para a lista</button></div>') +
            (u
                ? '<div class="seq-ultimo">✓ <b>' + esc(u.nome) + '</b> marcado(a) como convidado(a). ' +
                  '<a href="' + linkConvite(ev, u) + '" target="whats-convite">Abrir de novo</a> · ' +
                  '<button data-seq="desfazer">Não consegui enviar</button></div>'
                : "") +
            '<p class="seq-dica">No WhatsApp, toque em <b>Enviar</b> e volte para esta tela. Para evitar bloqueio do WhatsApp, vá com calma: de preferência em blocos de 20 a 30 convites, com uma pausa entre eles. Pode fechar e continuar depois, que a fila começa de onde parou.</p>' +
        '</div>';
    }

    function cliqueSequencia(e) {
        if (!seq) return;
        if (e.target === e.currentTarget) return fecharSequencia();
        var alvo = e.target.closest("[data-seq]");
        if (!alvo) return;
        var acao = alvo.getAttribute("data-seq"), lista = convidados(seq.ev.id);

        if (acao === "fechar") return fecharSequencia();
        if (acao === "enviar") {
            /* O link abre o WhatsApp normalmente; aqui só marca e avança */
            var i = seq.fila[seq.pos], p = lista[i];
            p.enviado = true;
            delete p._codigoNovo;
            seq.ultimo = i;
            seq.pos++;
            salvar("Convite de " + String(p.nome).trim().split(" ")[0] + " marcado como enviado ✓");
            setTimeout(desenharSequencia, 0);
            return;
        }
        if (acao === "pular") {
            seq.pos++; seq.pulados++;
            seq.ultimo = null;
            return desenharSequencia();
        }
        if (acao === "desfazer" && seq.ultimo != null) {
            var pu = lista[seq.ultimo];
            delete pu.enviado; delete pu.confirmado; delete pu.naoVai;
            seq.pos--;
            seq.fila[seq.pos] = seq.ultimo;
            seq.ultimo = null;
            salvar("Marca de convidado retirada");
            return desenharSequencia();
        }
    }

    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && seq) fecharSequencia();
    });

    function amostra() {
        var a = document.getElementById("amostra");
        if (!a) return;
        var t = EV.tema(evento(atual));
        a.style.background = "linear-gradient(135deg," + t.fundo1 + "," + t.fundo2 + ")";
        a.style.color = t.texto;
        a.innerHTML = '<span class="e">' + t.emoji + '</span><div><b style="color:' + t.titulo + '">' + esc(evento(atual).titulo || "Título do evento") + '</b>' +
            'Assim fica a página do evento.<br><span class="btn-a" style="background:' + t.destaque + ';color:' + (t.claro ? "#fff" : t.fundo1) + '">Botão</span></div>';
    }

    /* ---------------- Interação ---------------- */

    function ligarEditor() { amostra(); }

    function atualizarLista() {
        var itens = painel.querySelector(".itens");
        if (itens) itens.innerHTML = listaHTML();
    }

    function filtrarContatos() {
        var busca = chaveNome((document.getElementById("busca-contatos") || {}).value);
        var filtro = (document.getElementById("filtro-evento") || {}).value || "";
        painel.querySelectorAll("#lista-contatos li").forEach(function (li) {
            var ok = (!busca || li.getAttribute("data-k").indexOf(busca) >= 0) &&
                (!filtro || (" " + li.getAttribute("data-ev") + " ").indexOf(" " + filtro + " ") >= 0);
            li.style.display = ok ? "" : "none";
        });
    }
    function contarMarcados() {
        var n = painel.querySelectorAll("[data-contato]:checked").length, b = document.getElementById("add-contatos");
        if (b) { b.disabled = !n; b.textContent = n ? "Adicionar marcados (" + n + ")" : "Adicionar marcados"; }
    }

    /* Atualiza as marcas de um convidado sem redesenhar a lista */
    function atualizarLinha(i) {
        var ev = evento(atual), p = convidados(ev.id)[i];
        var li = painel.querySelectorAll(".linha-conv")[i];
        if (!li || !p) return;
        li.querySelector('[data-m="enviado"]').checked = !!p.enviado;
        li.querySelector('[data-m="confirmado"]').checked = !!p.confirmado;
        li.querySelector('[data-m="naoVai"]').checked = !!p.naoVai;
        li.querySelectorAll("[data-campo]").forEach(function (b) {
            var on = p[b.getAttribute("data-campo")] === b.getAttribute("data-v");
            b.classList.toggle("ativa", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        li.querySelector(".idade").classList.toggle("visivel", p.tipo === "crianca");
        var conv = li.querySelector("a.convite");
        if (conv) { conv.classList.toggle("enviado", !!p.enviado); conv.innerHTML = I.whats + (p.enviado ? "Enviado ✓" : "Enviar convite"); }
        atualizarResumo(ev);
    }

    painel.addEventListener("input", function (e) {
        var ev = atual && evento(atual);
        if (!ev) return;
        var el = e.target, c = el.getAttribute("data-c");

        /* Escolher dos convidados já salvos: busca, filtro e marcação */
        if (el.id === "busca-contatos" || el.id === "filtro-evento") return filtrarContatos();
        if (el.hasAttribute("data-contato")) return contarMarcados();
        if (el.id === "novo-nome") {
            var achou = CONTATOS_ABERTOS.filter(function (x) { return chaveNome(x.nome) === chaveNome(el.value); })[0];
            var w = document.getElementById("novo-whats");
            if (achou && achou.whats && !w.value) w.value = achou.whats;
            return;
        }

        /* Convidados */
        if (el.hasAttribute("data-m")) {
            var i = +el.getAttribute("data-i"), pc = convidados(ev.id)[i], m = el.getAttribute("data-m");
            if (el.checked) pc[m] = true; else delete pc[m];
            if (m === "confirmado" && el.checked && !pc.enviado) pc.enviado = true;   // quem confirmou já foi convidado
            if (m === "enviado" && !el.checked) { delete pc.confirmado; delete pc.naoVai; }
            if (m === "confirmado" && el.checked) delete pc.naoVai;
            if (m === "naoVai" && el.checked) { delete pc.confirmado; pc.enviado = true; }
            atualizarLinha(i);
            marcarSujo();
            return;
        }
        if (el.hasAttribute("data-i") && c) {
            convidados(ev.id)[+el.getAttribute("data-i")][c] = el.value;
            marcarSujo();
            return;
        }

        /* Cores próprias */
        if (el.hasAttribute("data-cor")) {
            ev.cores = ev.cores || {};
            var k = el.getAttribute("data-cor");
            ev.cores[k] = k === "claro" ? el.checked : el.value;
            marcarSujo(); amostra();
            return;
        }

        if (!c) return;
        if (c === "id") {
            var novo = slug(el.value);
            el.classList.toggle("erro", novo !== el.value);
            return;
        }
        var v = el.type === "checkbox" ? el.checked : el.value;
        if (c === "lat" || c === "lon") v = v === "" || isNaN(+v) ? "" : +v;
        ev[c] = v;

        /* Evento novo: o link acompanha o título até ser salvo */
        if (c === "titulo" && ev._novo) {
            var id = idLivre(slug(v), ev);
            trocarId(ev, id);
            var campoId = document.getElementById("c-id");
            if (campoId) campoId.value = id;
        }
        if (c === "titulo") painel.querySelector(".editor-topo h2").textContent = v || "Novo evento";
        marcarSujo();
        if (c === "titulo" || c === "data" || c === "rascunho" || c === "tema" || c === "emoji") { atualizarLista(); amostra(); }
    });

    painel.addEventListener("change", function (e) {
        var ev = atual && evento(atual), el = e.target;
        if (!ev) return;
        if (el.hasAttribute("data-item-compra")) {
            marcarItemCompra(ev, el.getAttribute("data-item-compra"), el.checked);
            var yc = window.scrollY;
            desenhar();
            window.scrollTo(0, yc);
            return;
        }
        if (el.id === "usar-cores") {
            document.getElementById("cores").classList.toggle("oculto", !el.checked);
            if (el.checked) {
                var t = EV.tema(ev);
                ev.cores = { fundo1: t.fundo1, fundo2: t.fundo2, destaque: t.destaque, titulo: t.titulo, texto: t.texto, claro: t.claro };
            } else delete ev.cores;
            marcarSujo(); amostra();
        }
        if (el.getAttribute("data-c") === "id") {
            var id = slug(el.value);
            if (id !== ev.id) {
                id = idLivre(id, ev);
                trocarId(ev, id);
                atual = id;
                marcarSujo(); atualizarLista();
            }
            el.value = ev.id;
            el.classList.remove("erro");
        }
    });

    function trocarId(ev, id) {
        if (ev.id === id) return;
        if (estado.convidados[ev.id]) {
            estado.convidados[id] = estado.convidados[ev.id];
            delete estado.convidados[ev.id];
        }
        ev.id = id;
        atual = id;
    }

    function abrir(id) {
        atual = id;
        history.replaceState(null, "", id ? "#" + encodeURIComponent(id) : location.pathname);
        desenhar();
        if (window.innerWidth < 900) document.getElementById("editor").scrollIntoView({ behavior: "smooth" });
    }

    function adicionar(nome, whats, de) {
        nome = String(nome || "").trim();
        if (!nome) return false;
        var p = { nome: nome, whats: String(whats || "").trim() };
        if (de) ["tipo", "sexo", "idade"].forEach(function (x) { if (de[x]) p[x] = de[x]; });   // vem junto de outro evento
        convidados(atual).push(p);
        return true;
    }

    painel.addEventListener("click", function (e) {
        var alvo = e.target.closest("[data-abrir],[data-acao],[data-aba],[data-remover],[data-esquecer],[data-campo],[data-filtro],[data-base],.convite");
        if (!alvo) return;

        if (alvo.hasAttribute("data-abrir")) return abrir(alvo.getAttribute("data-abrir"));
        if (alvo.hasAttribute("data-aba")) { aba = alvo.getAttribute("data-aba"); return desenhar(); }
        if (alvo.hasAttribute("data-base")) {
            baseCompras = alvo.getAttribute("data-base");
            var yb = window.scrollY;
            desenhar();
            window.scrollTo(0, yb);
            return;
        }
        if (alvo.hasAttribute("data-filtro")) {
            filtroResp[alvo.getAttribute("data-filtro")] = alvo.getAttribute("data-v");
            var y = window.scrollY;
            desenhar();
            window.scrollTo(0, y);
            return;
        }

        var ev = atual && evento(atual);

        if (alvo.classList.contains("convite")) {
            var p = convidados(ev.id)[+alvo.getAttribute("data-i")];
            if (p && (!p.enviado || p._codigoNovo)) {
                p.enviado = true;
                delete p._codigoNovo;
                atualizarLinha(+alvo.getAttribute("data-i"));
                salvar(true);
            }
            return;
        }

        /* Adulto/Criança e Masculino/Feminino: clicar de novo desmarca */
        if (alvo.hasAttribute("data-campo")) {
            var ic = +alvo.getAttribute("data-i"), pc = convidados(ev.id)[ic], campo = alvo.getAttribute("data-campo"), v = alvo.getAttribute("data-v");
            if (pc[campo] === v) delete pc[campo]; else pc[campo] = v;
            if (pc.tipo !== "crianca") delete pc.idade;
            atualizarLinha(ic);
            marcarSujo();
            if (campo === "tipo" && pc.tipo === "crianca") painel.querySelectorAll(".linha-conv")[ic].querySelector(".idade input").focus();
            return;
        }

        if (alvo.hasAttribute("data-esquecer")) {
            var ct = CONTATOS_ABERTOS[+alvo.getAttribute("data-esquecer")], k = chaveNome(ct.nome);
            var nomesEv = ct.eventos.map(function (id) { var o = evento(id); return "• " + (o ? o.titulo : id); }).join("\n");
            if (confirm("Tirar " + ct.nome + " de todos os eventos?\n\n" + nomesEv + "\n\nIsso só vale depois de Salvar.")) {
                Object.keys(estado.convidados).forEach(function (id) {
                    estado.convidados[id] = estado.convidados[id].filter(function (p) { return chaveNome(p.nome) !== k; });
                });
                marcarSujo(); desenhar();
                mostrarBarra(ct.nome + " foi tirado(a) de todos os eventos. Clique em Salvar.", false);
            }
            return;
        }

        if (alvo.hasAttribute("data-remover")) {
            var i = +alvo.getAttribute("data-remover"), lista = convidados(ev.id);
            if (confirm("Remover " + lista[i].nome + " da lista?")) {
                lista.splice(i, 1); marcarSujo(); desenhar();
            }
            return;
        }

        switch (alvo.getAttribute("data-acao")) {
            case "novo":
                var hoje = new Date(); hoje.setDate(hoje.getDate() + 30);
                var novo = {
                    id: idLivre("novo-evento"), titulo: "", data: hoje.toISOString().slice(0, 10), hora: "",
                    local: "", endereco: "", cidade: "Ipatinga", tema: "padrao", descricao: "", playlist: "",
                    fotos: [], album: "", rascunho: true, _novo: true
                };
                estado.eventos.unshift(novo);
                aba = "detalhes";
                marcarSujo();
                abrir(novo.id);
                document.getElementById("c-titulo").focus();
                break;

            case "duplicar":
                var dup = copia(ev);
                dup.titulo = ev.titulo + " (cópia)";
                dup.id = idLivre(ev.id + "-copia");
                dup.album = ""; dup.albumGoogle = ""; dup.fotos = []; dup.rascunho = true; dup._novo = true;
                estado.eventos.unshift(dup);
                marcarSujo();
                abrir(dup.id);
                break;

            case "excluir":
                if (!confirm("Excluir o evento \"" + (ev.titulo || ev.id) + "\" e a lista de convidados dele?\n\nIsso só vale depois de Salvar.")) return;
                estado.eventos = estado.eventos.filter(function (x) { return x !== ev; });
                delete estado.convidados[ev.id];
                marcarSujo();
                abrir(null);
                break;

            case "sequencia":
                abrirSequencia(ev);
                break;

            case "add-conv":
                var n = document.getElementById("novo-nome"), w = document.getElementById("novo-whats");
                if (adicionar(n.value, w.value)) { marcarSujo(); desenhar(); document.getElementById("novo-nome").focus(); }
                else n.focus();
                break;

            case "marcar-visiveis":
            case "desmarcar-contatos":
                var marcar = alvo.getAttribute("data-acao") === "marcar-visiveis";
                painel.querySelectorAll("#lista-contatos li").forEach(function (li) {
                    if (li.style.display !== "none" || !marcar) li.querySelector("input").checked = marcar;
                });
                contarMarcados();
                break;

            case "add-contatos":
                var qtdC = 0;
                painel.querySelectorAll("[data-contato]:checked").forEach(function (cb) {
                    var c = CONTATOS_ABERTOS[+cb.getAttribute("data-contato")];
                    if (c && adicionar(c.nome, c.whats, c)) qtdC++;
                });
                if (qtdC) { marcarSujo(); desenhar(); mostrarBarra(qtdC + (qtdC === 1 ? " convidado adicionado" : " convidados adicionados") + ". Clique em Salvar.", false); }
                break;

            case "add-varios":
                var linhas = document.getElementById("varios").value.split(/\n+/), qtd = 0;
                linhas.forEach(function (l) {
                    var m = l.match(/^(.*?)[\s,;:-]*((?:\+?\(?\d[\d\s().-]{7,}\d))?\s*$/);
                    if (m && adicionar(m[1].replace(/[\s,;:-]+$/, ""), m[2] || "")) qtd++;
                });
                if (qtd) { marcarSujo(); desenhar(); }
                break;

            case "copiar":
                var texto = ev.titulo + " (" + EV.dataCurta(ev) + ")\n" + convidados(ev.id).map(function (p, i) {
                    return (i + 1) + ". " + p.nome + (p.tipo === "crianca" ? " (criança" + (p.idade ? ", " + p.idade + (+p.idade === 1 ? " ano" : " anos") : "") + ")" : "") + (p.confirmado ? " ✅" : p.naoVai ? " ❌" : "");
                }).join("\n");
                navigator.clipboard.writeText(texto).then(function () {
                    alvo.textContent = "Copiado!";
                    setTimeout(function () { alvo.textContent = "Copiar lista"; }, 1800);
                });
                break;

            case "copiar-compras":
                navigator.clipboard.writeText(textoCompras(ev)).then(function () {
                    alvo.textContent = "Copiado!";
                    setTimeout(function () { alvo.textContent = "📋 Copiar lista de compras"; }, 1800);
                });
                break;

            case "limpar-envios":
                if (!confirm("Tirar as marcas de Convidado, Confirmado e Não vai de todos desta lista?\n\nIsso só vale depois de Salvar.")) return;
                convidados(ev.id).forEach(function (p) { delete p.enviado; delete p.confirmado; delete p.naoVai; });
                marcarSujo(); desenhar();
                break;
        }
    });

    painel.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (e.target.id === "novo-nome" || e.target.id === "novo-whats")) {
            e.preventDefault();
            painel.querySelector('[data-acao="add-conv"]').click();
        }
    });

    /* ---------------- Salvar ---------------- */

    var salvando = false, salvarDeNovo = null;
    function salvar(silencioso) {
        /* Se já está salvando (ex.: convites em sequência), salva de novo logo depois */
        if (salvando) { if (silencioso) salvarDeNovo = silencioso; return; }
        var erro = "";
        estado.eventos.forEach(function (ev) {
            if (!erro && !String(ev.titulo || "").trim()) erro = "Falta o título de um evento.";
            if (!erro && !/^\d{4}-\d{2}-\d{2}$/.test(ev.data || "")) erro = "Falta a data do evento \"" + ev.titulo + "\".";
        });
        if (erro) { mostrarBarra(erro, true); return; }

        /* Tira convidados de eventos que não existem mais e linhas sem nome */
        var conv = {};
        estado.eventos.forEach(function (ev) {
            var l = (estado.convidados[ev.id] || []).filter(function (p) { return String(p.nome || "").trim(); })
                .map(function (p) { var o = { nome: String(p.nome).trim() }; if (p.whats) o.whats = String(p.whats).trim(); if (p.enviado) o.enviado = true;
                    if (p.confirmado) o.confirmado = true;
                    if (p.naoVai) o.naoVai = true;
                    if (/^[a-z0-9]{8,20}$/.test(p.c || "")) o.c = p.c;
                    if (p.respEm) o.respEm = p.respEm;
                    if (p.tipo === "adulto" || p.tipo === "crianca") o.tipo = p.tipo;
                    if (p.sexo === "m" || p.sexo === "f") o.sexo = p.sexo;
                    var id = parseInt(p.idade, 10);
                    if (o.tipo === "crianca" && id >= 0 && id < 18) o.idade = id;
                    return o; });
            if (l.length) conv[ev.id] = l;
        });
        var eventos = estado.eventos.map(function (ev) { var o = copia(ev); delete o._novo; return limpo(o); });

        salvando = true;
        var botao = document.getElementById("salvar");
        botao.disabled = true;
        mostrarBarra("Salvando...", false);

        fetch("/api/admin/dados", {
            method: "PUT", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ eventos: eventos, convidados: conv, versao: estado.versao })
        })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { d._status = r.status; return d; }); })
        .then(function (d) {
            if (d._status !== 200) throw new Error(d.erro || "Erro " + d._status);
            estado.versao = d.versao;
            estado.eventos.forEach(function (ev) { delete ev._novo; });
            sujo = false;
            mostrarBarra(typeof silencioso === "string" ? silencioso : silencioso ? "Convite marcado como enviado ✓" : "Tudo salvo ✓ O site atualiza em até 1 minuto.", false);
            setTimeout(function () { if (!sujo) document.getElementById("barra").classList.remove("visivel"); }, 4000);
        })
        .catch(function (err) {
            mostrarBarra("Não salvou: " + err.message, true);
        })
        .then(function () {
            salvando = false; botao.disabled = false;
            if (salvarDeNovo) { var s = salvarDeNovo; salvarDeNovo = null; salvar(s); }
        });
    }

    document.getElementById("salvar").addEventListener("click", function () { salvar(false); });

    window.addEventListener("beforeunload", function (e) {
        if (sujo) { e.preventDefault(); e.returnValue = ""; }
    });
})();
</script>

</body>
</html>
